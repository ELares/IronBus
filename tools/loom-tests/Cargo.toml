[package]
name = "loom-tests"
description = "Dev-only scoped loom concurrency models for the IronBus cross-thread hot paths (#122)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# A STANDALONE dev-only crate (like tools/io-free-check): no shipped crate depends on it, and it
# depends on no ironbus crate, so its dev-dependency `loom` (and loom's own transitive deps, e.g.
# `tracing-subscriber` with `env-filter`) can NEVER unify into or otherwise reach a shipped crate's
# dependency graph. The loom models are faithful standalone replicas of the real structures' atomic
# ordering (the real symbols are named in the test's cross-reference comments), so they need no
# ironbus dependency. This isolation is what keeps the `cargo-auditable` SBOM of the shipped binary
# loom-free.
[lib]
path = "src/lib.rs"

# loom (#122): the permutation tester for `tests/loom_concurrency.rs`. cfg-gated so it resolves ONLY
# under `RUSTFLAGS="--cfg loom"`; a normal build never pulls it. loom is MIT (already on the
# deny.toml license allow-list). Because this crate is dev-only and on no shipped path, loom stays
# out of the shipped graph regardless.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints]
workspace = true
