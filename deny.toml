# Supply-chain policy for IronBus (https://embarkstudios.github.io/cargo-deny/).
[graph]
all-features = true

[licenses]
# Permissive licenses only, per the governance decision (#22). cargo-deny resolves with all-features
# (see `[graph]`), so this list must cover the FEATURE-gated trees too. The non-default `otlp` span
# exporter (#352) was reviewed against this list: every crate in the `opentelemetry`/`opentelemetry-otlp`
# gRPC tree is `MIT` / `Apache-2.0` / `BSD-2-Clause` / `BSD-3-Clause` (a few `Unicode-3.0`), all already
# present below, so the otlp tree adds NO new license (the entries below ARE the opentelemetry tree's
# license set; see the `[bans]` comment for the full per-crate review).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  # Boost Software License: permissive, no attribution clause on binaries. Pulled in by
  # xxhash-rust (the pure-Rust xxh3-64 used for the large-payload record checksum, #146).
  "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Per #139, the default path is pure Rust: no vendored-C crate is allowed on it. The default
# compression codec is lz4_flex (pure Rust); zstd (zstd-sys, vendored C) is opt-in only, behind an
# explicit feature, never on the default path. lz4_flex IS NOW on the record path (#387, the
# compression codec runtime in ironbus-core): it is MIT (already on the license allow-list above),
# pure Rust (built with the `safe-encode`/`safe-decode` features so it links no C and runs no
# C-building build script), and declares no `links` key, so it satisfies the C-FFI ban below and the
# cffi-ban.sh structural guard with no allowlist entry needed (only `links`/C-builder crates need one).
#
# THE OPT-IN zstd C-FFI ALLOWANCE (#357, #75/#76/#77, the #102 C-FFI allowlist). The maintainer
# APPROVED the opt-in zstd codec: it is behind the NON-DEFAULT `zstd` Cargo feature of ironbus-core
# (threaded up to storage and the CLI), so the DEFAULT build, its SBOM, and the cffi-ban gate (which
# scope to the shipped `ironbus-cli` DEFAULT graph) carry ZERO zstd and stay byte-for-byte unchanged
# (ADR-0003: the default codec stays pure-Rust lz4_flex). cargo-deny, however, resolves with
# `all-features` (see `[graph]`), so it DOES see the feature tree, and `zstd-sys` (the vendored-C
# zstd binding, `links = "zstd"`) is therefore DELIBERATELY NOT name-banned below: it is the
# explicitly allowed C-FFI under the feature. It is `MIT/Apache-2.0` (on the license allow-list) and
# is built VENDORED + STATIC (the `pkg-config` feature is NOT enabled, so zstd-sys compiles the
# bundled `zstd.1.5.7` C source rather than dynamically linking a system libzstd: the #77 musl
# static requirement). Its transitive `zstd`/`zstd-safe` are pure-Rust wrappers; `blake3` (the
# content-addressed dict_id hash) is pulled by the same feature and built with its `pure` feature so
# it compiles NO C/assembly (`CC0-1.0 OR Apache-2.0`, accepted via the Apache-2.0 arm; `cc` is a
# build-dep of both but runs nothing on the default graph and is off the SHIPPED graph). The
# `scripts/ci/cffi-ban.sh` STRUCTURAL guard still bans zstd-sys/zstd on the DEFAULT graph it scopes
# to, so the default build can never acquire the C-FFI silently; the allowance is feature-only.
#
# C-FFI BAN (#102). The best-known vendored-C / native crates are name-banned below as a
# belt-and-suspenders layer; the STRUCTURAL forward guard is `scripts/ci/cffi-ban.sh` (run by the
# CI `sbom` job over the shipped musl graph), which also catches an UNKNOWN `links` / C-builder
# crate this name list has no rule for. ALLOWLIST: `libc` and `nix` are pure-Rust bindings to OS
# SYSCALLS (no compiled C, no C-building build script), are on the license allow-list above, and
# are off the record path, so they are permitted (they are also exempted in cffi-ban.sh). The ONLY
# vendored-C allowance is the opt-in `zstd-sys` above (feature-gated, off the default graph). Add a
# crate here (and to that script's allowlist) ONLY if it is proven pure Rust; any further opt-in
# vendored-C dependency must be added to BOTH the allowlist and a documented #12 C-FFI allowance,
# never silently.
[[bans.deny]]
name = "openssl-sys" # vendored/system OpenSSL via a C build script; use rustls (pure Rust) instead.
[[bans.deny]]
name = "openssl" # the openssl-sys wrapper, same C linkage.
[[bans.deny]]
name = "libz-sys" # zlib C linkage; use a pure-Rust inflate/deflate (miniz_oxide) instead.
# NOTE: `zstd-sys` is DELIBERATELY NOT banned (see the opt-in zstd C-FFI allowance comment above):
# it is the maintainer-approved opt-in vendored-C codec, feature-gated and absent from the default
# graph the cffi-ban.sh + SBOM gates scope to (#357).
[[bans.deny]]
name = "lz4-sys" # the C lz4 binding; the default codec is lz4_flex (pure Rust) (#12, #139).
[[bans.deny]]
name = "bzip2-sys" # vendored bzip2 C.
[[bans.deny]]
name = "ring" # vendored C / assembly crypto; use a pure-Rust / *-rs primitive instead.
[[bans.deny]]
name = "aws-lc-sys" # vendored AWS-LC C.
[[bans.deny]]
name = "libsqlite3-sys" # vendored SQLite C.
[[bans.deny]]
name = "curl-sys" # libcurl C linkage.
[[bans.deny]]
name = "jemalloc-sys" # vendored jemalloc C; the system allocator is used.
[[bans.deny]]
name = "tikv-jemalloc-sys" # the maintained jemalloc fork, same C linkage.
[[bans.deny]]
name = "mimalloc" # vendored mimalloc C.
#
# (historical note) A C-FFI allowlist was deferred to #102 when no such opt-in dependency existed;
# #102 now lands the ban above plus the structural cffi-ban.sh guard.
#
# The macro-bench harness `ironbus-bench` (#111) is an internal, build-on-demand measurement tool,
# not part of the shipped broker. It pulls a small, permissive (MIT or Apache-2.0), pure-Rust
# dependency surface that the license allow-list above already covers, so no extra allowance is
# needed: `hdrhistogram` (the latency tail, with its `serialization` feature => `base64`, `flate2`,
# `miniz_oxide`, `nom`, `byteorder`), `rand` + `rand_distr` (the Poisson inter-arrival jitter), and
# `serde` + `serde_json` (the provenance JSON). All are pure Rust (no vendored C), so the #139
# pure-Rust policy holds for the harness too.
#
# Graceful shutdown (#195) adds `ctrlc` to `ironbus-cli` (the broker binary), the first non-trivial
# runtime dependency of a shipped crate beyond `crc32c`. It catches SIGINT/SIGTERM/SIGHUP so `serve`
# can flush the cursor and exit 0 on a clean stop. On Linux/musl (the CI target) it pulls `nix`,
# `libc`, `bitflags`, `cfg-if`, and `cfg_aliases` transitively; all are permissive (MIT, or MIT OR
# Apache-2.0) and the license allow-list above already covers them, so no extra allowance is needed.
# `libc` is the only FFI binding (libc bindings, not vendored C), so the #139 pure-Rust policy for
# the DEFAULT DATA path is unchanged: this is a signal-handling shim on the CLI, off the record path.
#
# Structured tracing (#16, #99) adds `tracing` + `tracing-subscriber` (the `fmt` + `json` features
# only, no `env-filter`/`ansi`) to `ironbus-server` for the JSON log layer compiled in by default.
# Transitively this pulls `tracing-core`/`-attributes`/`-serde`, `serde`/`serde_json`/`serde_core`/
# `serde_derive`, `sharded-slab`, `thread_local`, `once_cell`, `lazy_static`, `valuable`, `zmij`, and
# the proc-macro trio (`proc-macro2`, `quote`, `syn`); all are permissive (MIT, or MIT OR Apache-2.0,
# with `zmij`/`unicode-ident` adding the already-allowed Unicode-3.0) and pure Rust, so the license
# allow-list above already covers the whole tree and no new entry is needed. NONE of these is an
# opentelemetry crate: OTLP span export is behind the NON-DEFAULT `otlp` feature of `ironbus-server`,
# so the default and `edge-min` builds link zero opentelemetry (verify with `cargo tree --edges
# normal`, which is opentelemetry-free on the default build).
#
# The CONCRETE OTLP exporter (#99, #352) landed behind that NON-DEFAULT `otlp` feature: it adds
# `opentelemetry`, `opentelemetry_sdk`, `opentelemetry-otlp` (0.27, MSRV 1.71.1, below the 1.78 floor)
# and their transitive gRPC tree (`tonic`, `prost`, `tokio`, `hyper`, `h2`, `tower`, `http`, `bytes`,
# the `futures-*`/`pin-project`/`async-*` crates, ...). cargo-deny resolves with `all-features` (see
# `[graph]` above), so it DOES see this tree, and its licenses were REVIEWED: every transitive crate is
# `MIT`, `Apache-2.0`, `BSD-2-Clause`, or `BSD-3-Clause` (a few `Unicode-3.0` via `unicode-ident`), all
# ALREADY on the `allow` list above, so the otlp tree needs NO new license entry (the `allow` list is
# the opentelemetry tree's license set; nothing was added because nothing was missing). The TRANSPORT
# is PLAINTEXT gRPC (`grpc-tonic`, default-features off, NO TLS feature): a deliberate choice so the
# otlp build pulls NO `rustls`/`ring`/`aws-lc-sys`/`native-tls`/`openssl-sys` (all on the `[bans]`
# denylist below, which cargo-deny evaluates under all-features), keeping even the FEATURE build pure
# Rust. The whole tree declares no `links` key and runs no C-building build script, so the #102 C-FFI
# ban holds for it too; the #139 pure-Rust DATA-path policy is unchanged (span export is observability,
# off the record path, and absent entirely from the default/`edge-min` graph the cffi-ban + SBOM gates
# scope to). The deny `[bans]` denylist and the cffi-ban allowlist are NOT weakened.
#
# The TOML config-FILE layer (#85, #86, #382) adds the maintainer-APPROVED `toml` crate to
# `ironbus-cli` for the `--config <path>` parser (the decision recorded in docs/CONFIG.md section 5).
# `toml 0.5` is chosen deliberately for its MINIMAL dependency surface: its ONLY dependency is
# `serde` (already in the tree via tracing-subscriber's json feature above), so it adds NO new crate
# to the shipped `ironbus-cli` graph (no `toml_edit`/`indexmap`/`hashbrown`/`winnow`/`foldhash`). That
# matters twice: it keeps the 1.78 MSRV gate green (indexmap 2.10+ requires the `edition2024` Cargo
# feature, rustc >= 1.85) and the SBOM round-trip clean (no foldhash drift). It is PURE RUST with no
# `links` key or C build script (cargo-deny `bans` + scripts/ci/cffi-ban.sh verify this over the
# shipped musl graph), so the #102 C-FFI ban and the #139 pure-Rust DATA-path policy hold: config
# parsing is a CLI startup concern, off the record path.

[advisories]
yanked = "deny"
unmaintained = "all"
# Scoped, justified advisory acknowledgements. An entry here is a DELIBERATE decision that the
# named advisory does not apply to IronBus's usage AND cannot be resolved by upgrading yet; it is
# never a blanket mute. Re-review each on every dependency or MSRV change.
ignore = [
  # RUSTSEC-2026-0041 (lz4_flex < 0.11.6 / < 0.12.1): the LZ4 BLOCK decompressor under-validates a
  # match-copy OFFSET, so a crafted/invalid stream can copy from outside the initialized output and
  # leak (a) uninitialized memory when the `unsafe` decode path is used, or (b) the previous
  # contents of a REUSED output buffer. IronBus is NOT exposed on either path and CANNOT upgrade to
  # the fix yet:
  #   * `lz4_flex` is pinned to 0.10 because the fixed releases (0.11.6 / 0.12.1) declare a 1.81
  #     MSRV and IronBus's MSRV is 1.78 (the `msrv (1.78)` CI gate). Bumping the codec would break
  #     that gate; the MSRV rise is a separate, deliberate decision.
  #   * We enable the `safe-decode` feature (see ironbus-core/Cargo.toml), so the uninitialized-
  #     memory path (a) does not apply: decode never runs the `unsafe` implementation.
  #   * `ironbus_core::compress::decompress_payload` allocates a FRESH, ZEROED buffer
  #     (`vec![0u8; uncompressed_len]`) sized to the descriptor's claimed length on EVERY call and
  #     never reuses a user-supplied output buffer, so the reused-buffer leak path (b) does not
  #     apply either: the worst case is bytes from this record's own fresh, zeroed buffer.
  #   * The result is independently bounded: the claimed length is checked against an 8 MiB cap
  #     before allocation, the decoded length must equal it exactly (else a typed `CorruptStream`
  #     error), and the record body CRC is verified BEFORE any decompress. So no cross-record
  #     information leak and no panic are reachable.
  # Drop this ignore when the MSRV reaches 1.81 and `lz4_flex` is bumped to >= 0.11.6 (#387).
  "RUSTSEC-2026-0041",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
