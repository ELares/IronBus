name: Rolling release

# Publish a calendar-versioned GitHub Release on EVERY push to main, so installing IronBus on an
# edge device is "grab the latest release" (or run `scripts/install.sh`, which auto-detects the arch
# and pulls the latest release). This is the CONTINUOUS channel; the formal `v*` channel
# (`release.yml`) keeps the .deb + container + changelog gate. See docs/DISTRIBUTION.md.
#
# Each rolling build ships the three static musl edge binaries (x86_64, aarch64, armv7), a
# per-binary `.sha256`, one consolidated `SHA256SUMS`, and a keyless Sigstore build-provenance
# attestation over the binaries + `SHA256SUMS`. The build matrix reuses release.yml's proven static
# musl setup VERBATIM (same `cross`, same reproducible RUSTFLAGS + `SOURCE_DATE_EPOCH`, same
# static-link `readelf` assertion, same staging), and additionally stamps the calendar version into
# the binary via `IRONBUS_BUILD_VERSION` (read by `option_env!` in the `version` verb, forwarded
# into the cross container by Cross.toml).
#
# The version is `YYMM.1DD.1{Build}` (e.g. 2026-07-08 build 3 -> `2607.108.13`): UTC 2-digit
# year+month, then `1`+day, then `1`+per-day build number. The `1` prefixes keep every component
# leading-zero-free, so the string is VALID SEMVER and monotonically increasing over time while still
# reading as a calendar version. The first push of a day is `.11`, the next `.12`, the next day resets. The release is a NORMAL release (not a prerelease, not a
# draft), so GitHub's `releases/latest` points at the newest rolling build and the installer's
# default-latest works. Skip a build by putting `[skip release]` in the head commit message.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize close-together pushes so two builds never collide on the per-day build number (a NORMAL
# release tag is unique; without this, two near-simultaneous pushes could both compute the same N).
concurrency:
  group: rolling-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"

jobs:
  version:
    name: compute calendar version
    # The workflow_dispatch path always runs; a push runs unless the head commit says skip.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - id: compute
        name: compute YYMM.1DD.1{Build}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # CalVer `YYMM.1DD.1{Build}` (e.g. 2026-07-08 build 3 -> 2607.108.13). The `1` prefixes on the
          # day and the build keep every component leading-zero-free, so this string is VALID SEMVER and
          # monotonically increasing over time (major=year+month, minor=day, patch=build), while still
          # reading as a calendar version. Used as the release tag + the stamped/printed version.
          YYMM="$(date -u +%y%m)"      # 2-digit year + 2-digit month, e.g. 2607
          DAY="$(date -u +%d)"         # zero-padded day-of-month, e.g. 08
          PREFIX="${YYMM}.1${DAY}"     # `1`+DD -> the per-day namespace, e.g. 2607.108 (leading-zero-free)
          # Build number: the MAX of the existing same-day builds plus one, NOT count + one. Counting is
          # gap-fragile: a deleted tag, or an operator-created tag that jumped ahead, would make count+1
          # collide with an existing tag and `gh release create` would fail, shipping nothing. max+1 is
          # robust against gaps. Each same-day tag's patch is `1{Build}`, so `ltrimstr("1")` strips the
          # leading `1` to recover the build number (11->1, 115->15). No prior "$PREFIX." tag => max 0 =>
          # first build 1 => patch `11`, so each day resets. Old `YYYY.MMDD.N` and `v*` tags don't match
          # the `$PREFIX.` startswith, so they're ignored.
          maxbuild="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
            --jq "[.[].tagName | select(startswith(\"${PREFIX}.\")) | split(\".\")[-1] | ltrimstr(\"1\") | tonumber] | max // 0")"
          build=$((maxbuild + 1))
          VERSION="${PREFIX}.1${build}"  # `1`+build, e.g. 2607.108.115
          echo "computed rolling version: $VERSION (highest existing $PREFIX.* build: $maxbuild)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `target` is the internal cargo/cross BUILD triple (unchanged); `asset` is the published,
        # human-friendly binary name. The `unknown` vendor field in a Linux triple confuses non-Rust
        # edge operators, so the released asset drops the triple for an obvious CPU-arch name. The
        # mapping is pinned here so the build step stages the friendly name and every consumer
        # (SHA256SUMS, attestation, the release assets, the installer, the docs) agrees.
        include:
          - target: x86_64-unknown-linux-musl
            asset: ironbus-linux-amd64
          - target: aarch64-unknown-linux-musl
            asset: ironbus-linux-arm64
          - target: armv7-unknown-linux-musleabihf
            asset: ironbus-linux-armv7
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: rolling-${{ matrix.target }}
      - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2
        with:
          tool: cross
      - name: cross build the static ironbus binary (reproducible invocation, stamped version)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # The reproducible release invocation pinned in RELEASING.md (#101), reused VERBATIM from
          # release.yml: SOURCE_DATE_EPOCH is the head commit's date (not the runner wall clock); the
          # --remap-path-prefix pair drops the checkout dir and the cargo cache out of the binary's
          # embedded panic/track_caller/file!() strings; --locked uses the committed Cargo.lock.
          # CARGO_INCREMENTAL=0 is pinned in .cargo/config.toml. Cross.toml forwards SOURCE_DATE_EPOCH,
          # RUSTFLAGS, and IRONBUS_BUILD_VERSION into the cross container.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          export RUSTFLAGS="-D warnings --remap-path-prefix=${PWD}=/ironbus --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          # Stamp the calendar version into the binary; option_env!("IRONBUS_BUILD_VERSION") in the
          # version verb reads it, so `ironbus version` reports the published rolling build. This is
          # compile-time only and leaves Cargo.lock at 0.0.0, so --locked still holds.
          export IRONBUS_BUILD_VERSION="$VERSION"
          # Inspect only a freshly produced artifact, never a stale cached one.
          rm -f "target/${{ matrix.target }}/release/ironbus"
          cross build --release --locked -p ironbus-cli --target "${{ matrix.target }}"
      - name: assert the binary is statically linked
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/ironbus"
          test -x "$bin"
          # A static (including static-PIE) ELF carries no PT_INTERP segment and no NEEDED lib.
          if readelf -l "$bin" | grep -q 'INTERP'; then
            echo "::error::$bin has a PT_INTERP segment, it is dynamically linked"
            exit 1
          fi
          if readelf -d "$bin" 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::$bin lists NEEDED shared libraries, it is not static"
            exit 1
          fi
      - name: stage the artifact and its checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          # Stage the binary under its FRIENDLY published name (the `unknown`-vendored triple is only
          # the internal cargo/cross target); the per-binary .sha256 is named with that same bare
          # asset name so `sha256sum -c` works from the download dir. The consolidated SHA256SUMS is
          # built once in the publish job.
          out="dist/${{ matrix.asset }}"
          cp "target/${{ matrix.target }}/release/ironbus" "$out"
          ( cd dist && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256" )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish rolling release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag + GitHub Release
      id-token: write # keyless Sigstore signing via OIDC
      attestations: write # store the build-provenance attestation
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: collect the binaries and build the consolidated SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p dist
          # Copy the three FRIENDLY-named binaries and their per-binary .sha256 out of the per-asset
          # artifacts, then build one SHA256SUMS over the three binaries (the installer's source of
          # truth). The asset names are the published, human-friendly names; the triple stays the
          # internal build target only.
          for a in ironbus-linux-amd64 ironbus-linux-arm64 ironbus-linux-armv7; do
            cp "artifacts/${a}/${a}" "dist/${a}"
            cp "artifacts/${a}/${a}.sha256" "dist/${a}.sha256"
          done
          ( cd dist && sha256sum \
              ironbus-linux-amd64 \
              ironbus-linux-arm64 \
              ironbus-linux-armv7 \
              > SHA256SUMS )
          # Self-check: the consolidated file must verify before it ships, so a bad upload can
          # never produce a release whose SHA256SUMS does not match its own binaries.
          ( cd dist && sha256sum -c SHA256SUMS )
          ls -l dist
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          # Keyless Sigstore build-provenance over the binaries + SHA256SUMS, so a verifier can
          # anchor the whole set to one provenance (verify with `gh attestation verify`).
          subject-path: |
            dist/ironbus-linux-amd64
            dist/ironbus-linux-arm64
            dist/ironbus-linux-armv7
            dist/SHA256SUMS
      - name: create the rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The install table maps the edge CPU to its asset. Heredoc keeps the markdown readable;
          # no changelog gate (rolling builds are continuous, not curated). A NORMAL release (no
          # --prerelease, no --draft) so releases/latest resolves to this newest build.
          notes="$(cat <<EOF
          Automatic rolling build \`${VERSION}\` from commit \`${SHA}\`.

          ## Install

          One line (auto-detects your CPU arch and verifies the checksum):

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/ELares/IronBus/main/scripts/install.sh | sh
          \`\`\`

          Each binary is a static \`musl\` build (no runtime dependency, not even a libc). Grab the
          one for your CPU from this release, \`chmod +x\`, and run:

          | Edge CPU | Asset |
          | --- | --- |
          | Raspberry Pi 4 / 5 (64-bit) and other arm64 | \`ironbus-linux-arm64\` |
          | Raspberry Pi 32-bit / armv7 | \`ironbus-linux-armv7\` |
          | x86_64 / amd64 | \`ironbus-linux-amd64\` |

          Verify integrity with \`sha256sum -c SHA256SUMS\`, and provenance with \`gh attestation verify <asset> --repo ${REPO}\`. See docs/DISTRIBUTION.md for all channels.
          EOF
          )"
          gh release create "$VERSION" \
            --repo "$REPO" \
            --title "$VERSION" \
            --target "$SHA" \
            --notes "$notes" \
            dist/ironbus-linux-amd64 \
            dist/ironbus-linux-amd64.sha256 \
            dist/ironbus-linux-arm64 \
            dist/ironbus-linux-arm64.sha256 \
            dist/ironbus-linux-armv7 \
            dist/ironbus-linux-armv7.sha256 \
            dist/SHA256SUMS

  container:
    name: publish multi-arch image to ghcr.io
    # The live image source (#334): every rolling build publishes the distroless container to
    # ghcr.io/elares/ironbus, multi-arch (amd64 + arm64 + armv7), tagged with the calendar version
    # AND :latest. It rides the SAME verified binaries the build matrix produced (no recompile), so
    # the verify-before-package property holds: Dockerfile.release copies the pre-built static musl
    # binary straight in, never compiles. Distinct from the formal `release.yml` container job (which
    # also pushes the friendly tags on a `v*` tag); see docs/DISTRIBUTION.md channel 3.
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the image to ghcr.io with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: stage the three verified binaries per target platform
        run: |
          set -euo pipefail
          # Lay the pre-built, friendly-named binaries out under dist/<TARGETPLATFORM>/ironbus so
          # Dockerfile.release's per-platform COPY selects the matching one for each manifest layer
          # (amd64 -> ironbus-linux-amd64, arm64 -> ironbus-linux-arm64, arm/v7 -> ironbus-linux-armv7).
          # These are the EXACT bytes the build matrix produced and checksummed; no recompile here.
          # upload/download-artifact drop the +x bit, so restore it (Dockerfile.release also chmods).
          for pair in \
            "linux/amd64:ironbus-linux-amd64" \
            "linux/arm64:ironbus-linux-arm64" \
            "linux/arm/v7:ironbus-linux-armv7"; do
            plat="${pair%%:*}"
            asset="${pair##*:}"
            mkdir -p "dist/${plat}"
            cp "artifacts/${asset}/${asset}" "dist/${plat}/ironbus"
            chmod 0755 "dist/${plat}/ironbus"
          done
          ls -lR dist
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: log in to ghcr.io with the built-in GITHUB_TOKEN
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # ghcr.io is this repo's own registry, so the workflow's built-in GITHUB_TOKEN (with the
          # job-scoped `packages: write` above) is enough; no external/org secret is needed. Feed the
          # token on stdin (never an argv `-p`, which would leak it into the process table / logs).
          printf '%s' "${TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin
      - name: build and push the multi-arch image (amd64 + arm64 + armv7)
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # The package is the lowercased repository under ghcr.io (ghcr.io/elares/ironbus). Build a
          # single multi-platform manifest from the three pre-built binaries and push BOTH the calendar
          # version and :latest in one invocation. COPY-only Dockerfile (no RUN executes the foreign
          # binary), so the cross-arch layers need no QEMU emulation.
          repo="ghcr.io/$(printf '%s' "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          docker buildx build \
            -f Dockerfile.release \
            --platform linux/amd64,linux/arm64,linux/arm/v7 \
            -t "${repo}:${VERSION}" \
            -t "${repo}:latest" \
            --push \
            .
          echo "pushed ${repo}:${VERSION} and ${repo}:latest (linux/amd64,linux/arm64,linux/arm/v7)"
