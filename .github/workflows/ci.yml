name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is the broker's platform: run the FULL feature matrix, INCLUDING `tls` (rustls +
          # aws-lc-rs, ADR-0004). ubuntu-latest ships cmake, which aws-lc-sys's vendored-C build needs.
          - os: ubuntu-latest
            featureflags: "--all-features"
          # Windows is a client/tooling platform. Run every feature EXCEPT `tls`: aws-lc-sys's
          # vendored-C build is validated on the Linux leg (the broker target), and forcing it onto
          # the Windows runner (NASM/MSVC) adds cross-platform C-build risk for no coverage gain — the
          # TLS 1.3 config is fully exercised on ubuntu. This keeps the existing zstd (vendored-C via
          # cc) + otlp coverage. UPDATE this list if a new NON-tls feature is added.
          - os: windows-latest
            featureflags: "--features zstd,otlp"
    runs-on: ${{ matrix.os }}
    # Bound the known LOAD-DEPENDENT hang (an intermittent raft_cluster deadlock that only
    # reproduces under the full parallel workspace run; passes in isolation) to a 30-minute
    # failure instead of the runner's 6-hour default. The job normally finishes in ~6 min
    # (ubuntu) / ~4 min (windows), so 30 min is ~5x headroom: a timeout here is a REAL hang
    # signal, never ordinary-slowness noise. Root-causing the deadlock is tracked separately;
    # this line is the containment.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --workspace ${{ matrix.featureflags }} --locked

  acceptance:
    name: golden-path acceptance gate (#133)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: acceptance
      # The single scripted GOLDEN-PATH acceptance run (#133): install via the fail-closed
      # installer, boot zero-config, produce, fan out, overload, simulated power-cut, recover with a
      # bounded reported loss, resume, inspect offline, and upgrade in place, driving the REAL
      # `ironbus` binary over real loopback sockets and a real on-disk data dir, end to end. It is a
      # HARD release gate (this job must pass). The device-only steps (the < 60 s
      # install-to-first-message on the reference aarch64 device, the real dm-flakey power cut, the
      # device throughput SLO) are NOT run here; they are the manual runbook in docs/ACCEPTANCE.md,
      # the SAME harness run on the device. `--nocapture` surfaces the machine-readable PASS/FAIL
      # summary (the captured loss report, install-to-first-message, and throughput numbers) in the
      # job log. The harness writes the same JSON to the path in IRONBUS_ACCEPTANCE_SUMMARY, which we
      # upload as an artifact for the #19 SLO table / #1 success-criteria tooling to consume.
      - name: run the golden-path acceptance scenario (CI-runnable steps)
        env:
          IRONBUS_ACCEPTANCE_SUMMARY: ${{ runner.temp }}/acceptance-summary.json
        run: |
          cargo test -p ironbus-cli --locked --test acceptance -- --nocapture --exact \
            golden_path_acceptance_install_to_recovery_to_upgrade
      - name: upload the machine-readable acceptance summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golden-path-acceptance-summary
          path: ${{ runner.temp }}/acceptance-summary.json
          if-no-files-found: warn

  regression-gate:
    name: perf regression gate (#114)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: regression-gate
      # The rolling-median performance regression gate (#114). It compares the per-device 7-day
      # median throughput / p99 / p99.9 of the current run history against the last released tag's
      # baseline and FAILS only on an un-ratified regression (throughput median down > 10%, p99 median
      # up > 15%, p99.9 median up > 25%); warm-up-CoV-failed runs are advisory-only and an edge
      # regression needs a human --ratify to block. The gate's fire/no-op/advisory/ratify logic is
      # unit + binary tested (the lib `regression` tests and `tests/regression_gate_cli.rs`), run by
      # the workspace `test` job above; this job additionally EXECUTES the shipped gate binary against
      # the checked-in history fixture to prove the END-TO-END wiring. ARMED at v0.1.0 (#1068): the
      # release archived a baseline JSON (docs/benchmarks/baselines/v0.1.0/perf-baseline.json), so the
      # gate now runs its ENFORCING path (`--baseline`) instead of the pre-release no-baseline no-op —
      # an un-ratified rolling-median regression exits non-zero and (via pipefail) FAILS this step. The
      # LIVE per-device numbers come from the #111 macro-bench run on the reference edge device, which
      # is a documented device residual, not a CI run; this job validates the GATE against the checked-in
      # history + the archived baseline (see the baseline README for the re-anchor note), not live runs.
      - name: run the regression gate against the checked-in history (v0.1.0 baseline => enforcing)
        run: |
          set -euo pipefail
          cargo run --locked -p ironbus-bench --bin ironbus-regression-gate -- \
            --history crates/ironbus-bench/tests/fixtures/regression-history.json \
            --baseline docs/benchmarks/baselines/v0.1.0/perf-baseline.json \
            | tee gate-output.txt
          # The gate now ENFORCES: a fired (un-ratified) regression exits 1 and fails this step via
          # pipefail. Additionally assert the enforcing within-thresholds PASS path was taken, so a
          # silent fallback to the no-baseline no-op (a moved/deleted/renamed baseline file) also fails
          # rather than passing vacuously.
          if ! grep -q 'all device medians within thresholds' gate-output.txt; then
            echo "::error::the regression gate did not take the expected enforcing within-thresholds path (baseline missing, or a regression fired)"
            exit 1
          fi
          echo "ok: regression gate enforced against the v0.1.0 baseline (within thresholds, exit 0)"

  consume-corpus-gate:
    name: consume corpus fairness gate (#554)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: consume-corpus-gate
      # The V2-M1 consume scoreboard gate (#554): the committed single-consumer consume corpus
      # (`docs/benchmarks/consume-rows.jsonl`, the t4g head-to-head) must still ASSEMBLE under the
      # durability-label fairness lint — i.e. IronBus Tier-S streaming and NATS JS pull stay matched
      # at the `durable-consume` label, and the non-durable NATS core sub is never force-paired
      # against a durable consumer. `consume-corpus` exits non-zero if any pair is mislabeled, so a
      # silent regression of the matched scoreboard (a marketing comparison creeping in) fails CI.
      # This is the consume twin of the produce corpus's `assemble-corpus` lint, run on the COMMITTED
      # rows the milestone asserts against (the live t4g numbers themselves are a documented device
      # residual, not a CI run; this gate validates the SCOREBOARD's fairness, not the run). The
      # `consume_corpus.rs` + `comparison.rs` unit tests (run by the workspace `test` job) cover the
      # pairing/lint logic; this job additionally proves the END-TO-END wiring on the real rows.
      - name: assert the committed consume corpus passes the fairness lint
        run: |
          set -euo pipefail
          cargo run --locked -p ironbus-bench --bin consume-corpus -- \
            --rows docs/benchmarks/consume-rows.jsonl \
            --json-out "${RUNNER_TEMP}/consume-report.json" \
            --md-out "${RUNNER_TEMP}/consume-report.md" 2>&1 | tee "${RUNNER_TEMP}/consume-gate.txt"
          if ! grep -q 'all lints passed' "${RUNNER_TEMP}/consume-gate.txt"; then
            echo "::error::the committed consume corpus did not pass the durability-label fairness lint"
            exit 1
          fi
          echo "ok: committed consume corpus assembles under the fairness lint (#554)"

  msrv:
    name: msrv (1.78)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.78.0
        with:
          toolchain: "1.78.0"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo build --workspace --all-features --locked

  core-no-io:
    name: ironbus-core is IO-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Structural source check (#143): replaces the former source-text grep. tools/io-free-check
      # parses every crates/ironbus-core/src/*.rs with `syn` (a real Rust parser) and walks the AST
      # for forbidden references (std::{fs,net,process,os,io}, tokio/async_std/smol/mio, and extern
      # FFI blocks), expanding grouped/aliased/glob `use` trees to their real paths. Being AST-level
      # it is immune to import grouping, aliasing, odd whitespace, and comments, which a line regex
      # is not. io-free-check is a dev-only workspace member (tools/*) that no shipped crate depends
      # on, so `syn` never enters ironbus-core's own dependency graph.
      - name: structural AST check that ironbus-core sources are IO-free
        run: cargo run --locked -p io-free-check -- crates/ironbus-core/src
      # The necessary SECOND half of the structural guarantee (#143): the AST source walk only sees
      # ironbus-core's OWN source, so IO that arrives by re-export from a dependency is invisible to
      # it. The dep-tree check below catches that. Together (AST source walk + dep-tree) they are the
      # structural invariant. A compiler-level dylint that resolves every path against the real name
      # resolver would be strictly stronger and is a possible future hardening. Residual gap: std::*
      # IO hidden inside a local `macro_rules!` body is caught by neither half (syn sees a macro body
      # as opaque tokens; std::* needs no dependency), so that one contrived case relies on review.
      - name: forbid async-runtime crates in the ironbus-core dependency tree
        run: |
          set -euo pipefail
          deps="$(cargo tree -p ironbus-core -e normal,build --prefix none --locked | awk '{print $1}' | sort -u)"
          if echo "$deps" | grep -qxE 'tokio|mio|async-std|smol'; then
            echo "::error::ironbus-core must not depend on an async runtime"
            echo "$deps"
            exit 1
          fi
          echo "ironbus-core dependency tree is runtime-free"

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2
        with:
          tool: cargo-deny@0.19.8
      - run: cargo deny check

  spdx:
    name: SPDX headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: every Rust source starts with the SPDX header
        run: |
          set -euo pipefail
          miss=0
          while IFS= read -r f; do
            head -3 "$f" | tr -d '\r' | grep -qF '// SPDX-License-Identifier: MIT OR Apache-2.0' || { echo "missing SPDX: $f"; miss=1; }
          done < <(git ls-files '*.rs')
          if [ "$miss" = "1" ]; then
            echo "::error::all Rust sources must start with: // SPDX-License-Identifier: MIT OR Apache-2.0"
            exit 1
          fi
          echo "all Rust sources carry the SPDX header"

  format-registry:
    name: format-registry (#126 #132)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The on-disk-format version-registry gate (#126, #132): a change to the byte-layout
      # consts/offsets in crates/ironbus-core/src/format.rs must also update the registry in
      # docs/compat/versions.md. The script hashes only the layout-defining `pub const` lines
      # (before the #[cfg(test)] block, whitespace-normalized) and compares the digest to the one
      # pinned on the `format-layout-sha256:` line in the registry, so a silent encoding change
      # fails here rather than mis-parsing durable data on a deployed reader. Deterministic and
      # history-free: no git diff base is needed. Re-pin after an INTENTIONAL bump with
      # `sh scripts/check-format-registry.sh --print`.
      - name: assert an on-disk format change also updates the version registry
        run: sh scripts/check-format-registry.sh

  fmea-coverage:
    name: FMEA coverage gate (#129)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The consolidated-FMEA coverage gate (#129): docs/FMEA.md aggregates every per-issue
      # failure mode into one operator-facing table, and this gate is its mechanized acceptance
      # criterion. The script holds a curated list of required failure-mode IDs (F1..Fn) each
      # with an anchor keyword, and fails if any ID is missing a table row, any anchor keyword is
      # absent (so a row cannot be gutted while keeping its ID), or the IDs are not contiguous (so
      # a row cannot be silently dropped from the middle). Deterministic and history-free: no
      # network, no gh, no git diff base. To add a failure mode, append a row to docs/FMEA.md and
      # an `Fn|<keyword>` line to the REQUIRED block in the script (see docs/FMEA.md).
      - name: assert every required per-issue failure mode appears in the consolidated FMEA
        run: sh scripts/ci/fmea-coverage.sh

  slo-table-drift:
    name: SLO-table drift gate (#359)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The SLO-table drift gate (#359, the #110 residual): the SLO target table has a
      # human-readable form (docs/SLO.md) and a versioned machine-readable form
      # (docs/schemas/slo.v1.json, schema ironbus.slo-table.v1) that CI and the #111 macro-bench
      # read targets from. This gate keeps the two from diverging: it asserts the JSON parses,
      # carries schema_version 1, has every required field on every row, encodes the
      # not-yet-measured invariant (no row ratified, every measured cell null), and that the stated
      # target numbers match docs/SLO.md. A number changed in one file but not the other fails
      # here. Deterministic, offline, history-free: no network, no gh, no git diff base; needs only
      # jq (pre-installed on ubuntu-latest).
      - name: assert the SLO JSON parses, is unratified, and agrees with docs/SLO.md
        run: sh scripts/ci/slo-table-check.sh

  cross-build:
    name: musl build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2
        with:
          tool: cross
      # The global RUSTFLAGS "-D warnings" is forwarded into the cross container, so this
      # job also gates each edge target for warning-clean compilation, not only static linking.
      - name: cross build the static ironbus binary
        run: |
          # Remove any cached binary so the static-link assertion below can only ever inspect a
          # freshly produced artifact, never a stale one cargo declined to relink.
          rm -f "target/${{ matrix.target }}/release/ironbus"
          cross build --release --locked -p ironbus-cli --target ${{ matrix.target }}
      - name: assert the binary is statically linked (no interpreter, no NEEDED libs)
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/ironbus"
          test -x "$bin"
          # A static (including static-PIE) ELF carries no PT_INTERP segment and no NEEDED
          # shared library. Checking the ELF structure with readelf is robust across file(1)
          # versions and target arches: a static-PIE musl binary is reported "dynamically
          # linked" by older file and "static-pie linked" by newer file, so that substring
          # cannot prove staticness, whereas the absence of PT_INTERP and NEEDED always can.
          if readelf -l "$bin" | grep -q 'INTERP'; then
            echo "::error::$bin has a PT_INTERP segment, it is dynamically linked"
            exit 1
          fi
          if readelf -d "$bin" 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::$bin lists NEEDED shared libraries, it is not static"
            exit 1
          fi
          echo "ok: $bin is a static executable (no interpreter, no NEEDED libs)"
      # The static-link assertion above proves the binary depends only on the kernel; it does NOT
      # prove the binary can actually START on its target ISA. A musl/qemu startup fault (a relocation
      # the loader cannot apply, a bad TLS or stack-guard setup, host-sysroot leakage) links clean but
      # crashes on first instruction, and only EXECUTING the artifact catches it (#100, parent #17).
      # The aarch64 and armv7 emulators come from apt's qemu-user-static (invoked explicitly, no
      # binfmt registration needed), so this job adds no new pinned `uses:` action.
      - name: install qemu-user-static for the cross-arch smoke
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
      # The per-target SMOKE: run the freshly-built static binary and assert it EXECUTES, not merely
      # that it links static. x86_64-musl runs natively on the x86_64 runner; aarch64 and armv7 run
      # under qemu-user (explicit qemu-<arch>-static, no Docker, no binfmt). Each check is
      # deterministic and offline (no server, no socket, no thread), so it is fast and non-flaky under
      # qemu-user: `--version` and `--help` are pure stdout-and-exit, and `dump` on an EMPTY data dir
      # exercises the storage open + offline-reader scan path then exits 0 with no record to decode. A
      # networked produce/consume smoke is deliberately NOT run here (sockets/threads under qemu-user
      # are flaky); the native test job already covers the wire path on x86_64.
      - name: smoke-test the static binary on its target architecture
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/ironbus"
          test -x "$bin"
          # The qemu-user emulator for the cross targets; empty for the native x86_64 host. Used
          # unquoted as a command prefix so an empty value expands to nothing (a native run) and a
          # non-empty value to the single emulator binary (no spaces, so no word-split hazard); this
          # avoids the empty-array-under-`set -u` pitfall of `"${arr[@]}"`.
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)      qemu=""                  ;;
            aarch64-unknown-linux-musl)     qemu="qemu-aarch64-static" ;;
            armv7-unknown-linux-musleabihf) qemu="qemu-arm-static"   ;;
            *) echo "::error::no smoke runner for ${{ matrix.target }}"; exit 1 ;;
          esac
          # `ironbus --version` is a single deterministic line `ironbus <semver>`, exit 0.
          ver="$($qemu "$bin" --version)"
          echo "version: $ver"
          case "$ver" in
            "ironbus "*) : ;;
            *) echo "::error::--version did not print the expected 'ironbus <version>' line"; exit 1 ;;
          esac
          # `ironbus --help` prints the usage banner, exit 0; assert a known usage substring.
          help="$($qemu "$bin" --help)"
          case "$help" in
            *"USAGE:"*"ironbus serve"*) : ;;
            *) echo "::error::--help did not print the expected usage banner"; exit 1 ;;
          esac
          # A tiny OFFLINE end-to-end check: `dump` on an empty (but existing) data dir runs the
          # storage-open and offline-reader scan path with no server, no socket, and no record to
          # decode, and must exit 0 cleanly. This catches a startup crash that only the IO/storage
          # init path triggers, which neither --version nor --help reach.
          empty_dir="$(mktemp -d)"
          $qemu "$bin" dump --data-dir "$empty_dir"
          echo "ok: $bin runs on ${{ matrix.target }} (--version, --help, offline dump all exit 0)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ironbus-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/ironbus
          if-no-files-found: error

  parse-32bit:
    name: parser tests (32-bit ${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-unknown-linux-gnu
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2
        with:
          tool: cross
      # ironbus-core parses untrusted bytes; the record and segment codecs do their length
      # arithmetic in u64 specifically so a 32-bit usize cannot overflow (the #147 fix). The
      # 64-bit test matrix never exercises that path, so run ironbus-core's tests on a 32-bit
      # target here: a future usize-width regression in a parser is caught, not only built. The
      # global RUSTFLAGS "-D warnings" is forwarded into the cross container, so this also gates
      # a warning-clean 32-bit compile. i686 binaries run natively on the x86_64 runner (no qemu).
      - name: cross test the byte parsers on a 32-bit target
        run: cross test --locked -p ironbus-core --target ${{ matrix.target }}

  conformance-byte-identity:
    name: conformance corpus byte-identity (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target:
          # The two production edge ISAs. x86_64 runs natively on the runner; aarch64 runs
          # under qemu-user (via cross). Both regenerate the frozen #45 conformance corpus and
          # must reproduce the SAME checked-in bytes and cross-verify the SAME header_crc /
          # body_crc, so an endianness or alignment bug that only shows on aarch64 fails here
          # rather than on a deployed edge box. The encoders are endianness-explicit LE, so
          # byte-identity must hold; this job makes it a gate. (The i686 32-bit arch already runs
          # the same ironbus-core tests in the parse-32bit job, adding a little-endian 32-bit
          # leg.)
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: conformance-${{ matrix.target }}
      - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2
        with:
          tool: cross
      # cross runs the aarch64 tests under qemu-user; x86_64-gnu runs natively but is invoked
      # through cross too so both legs share one command shape. The conformance gate
      # (`conformance_corpus`) regenerates every fixture and asserts it equals the checked-in
      # bytes (or digest), then re-encodes each record and verifies its CRCs; the
      # `conformance_recovery` storage gate drives the same fixtures through real recovery. A
      # byte that differs across arches fails the byte-equality assertion on the differing arch.
      - name: cross-test the conformance corpus on the target ISA
        run: |
          cross test --locked -p ironbus-core --target ${{ matrix.target }} --test conformance_corpus
          cross test --locked -p ironbus-storage --target ${{ matrix.target }} --test conformance_recovery

  sbom:
    name: cargo-auditable SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: sbom
      - name: install musl tooling and cargo-auditable
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          cargo install --locked cargo-auditable rust-audit-info
      # Prove the release SBOM path: a cargo-auditable build of the musl binary embeds the
      # dependency manifest, and rust-audit-info can extract it. This is exactly what the
      # release workflow ships, so a break in the SBOM toolchain is caught per-PR, not at a tag.
      - name: build with an embedded SBOM and verify it lists the workspace crates
        run: |
          set -euo pipefail
          cargo auditable build --release --locked -p ironbus-cli --target x86_64-unknown-linux-musl
          bin="target/x86_64-unknown-linux-musl/release/ironbus"
          test -x "$bin"
          rust-audit-info "$bin" > sbom.json
          test -s sbom.json
          grep -q 'ironbus-core' sbom.json
          grep -q 'ironbus-cli' sbom.json
          echo "ok: embedded cargo-auditable SBOM present and lists the workspace crates"
      # SBOM round-trip diff (#102): recover the embedded SBOM and assert it equals the shipped
      # dependency graph (both directions) AND that every crate is pinned in Cargo.lock at the same
      # version. The grep above only proves the SBOM is non-empty; this proves it is COMPLETE and
      # faithful, so a crate that drifts into the binary but not the lock (or vice versa) fails here.
      # The graph is taken for the SAME musl target the binary was built for, so the comparison is
      # target-consistent.
      - name: SBOM round-trip diff against the shipped graph and Cargo.lock
        run: |
          rustup target add x86_64-unknown-linux-musl >/dev/null 2>&1 || true
          sh scripts/ci/sbom-diff.sh \
            target/x86_64-unknown-linux-musl/release/ironbus \
            x86_64-unknown-linux-musl
      # C-FFI ban (#102, #139): assert no crate in the shipped musl graph pulls a C-compiled
      # component, a build script that compiles C, or a `links` native-library key. The opt-in zstd
      # codec (#357) is the only vendored-C allowance and is behind the NON-DEFAULT `zstd` feature,
      # so this DEFAULT-graph ban (built without `--features zstd`) stays clean: zstd is absent.
      - name: C-FFI ban on the shipped dependency graph
        run: sh scripts/ci/cffi-ban.sh x86_64-unknown-linux-musl
      # Regression guard for the ADR-0003 / #357 invariant: the DEFAULT shipped graph carries NO
      # zstd (and no blake3). If a refactor ever made the zstd feature default-on, the default
      # binary's SBOM and the cffi-ban above would silently acquire the vendored-C codec; this fails
      # FIRST and explicitly. It checks the same default `ironbus-cli` normal+build graph the SBOM
      # and cffi-ban scope to.
      - name: assert the DEFAULT shipped graph is zstd-free (ADR-0003, #357)
        run: |
          set -euo pipefail
          graph="$(cargo tree -p ironbus-cli -e normal,build --target x86_64-unknown-linux-musl --prefix none --locked)"
          if echo "$graph" | grep -qiE 'zstd|blake3'; then
            echo "::error::the DEFAULT shipped graph contains zstd/blake3; the zstd codec must stay opt-in (ADR-0003, #357)"
            echo "$graph" | grep -iE 'zstd|blake3'
            exit 1
          fi
          echo "ok: the default shipped graph is zstd-free (the zstd codec is opt-in only)"

  zstd-feature:
    name: opt-in zstd codec (build + test + musl static-link)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: zstd-feature
      - name: install musl tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      # The OPT-IN zstd codec + trained-dictionary lifecycle (#357): build and TEST the feature so
      # the opt-in path (the zstd codec id 2, ZDICT training, the sidecar IO, the dict CLI) is
      # covered per-PR, with the teeth tests (round-trip, corrupt-stream-is-typed-error,
      # decompression-bomb-capped, trained-dict-improves-ratio, unresolved-dict-is-poison). The
      # default build is unchanged; this job is the only one that compiles `--features zstd`.
      - name: build and test the opt-in zstd feature
        run: |
          set -euo pipefail
          cargo build --workspace --features zstd --locked
          cargo test --workspace --features zstd --locked
      # cargo-deny under the feature: assert the new vendored-C C-FFI (zstd-sys) is the EXPLICITLY
      # allowed dependency (deny.toml resolves all-features), so the supply-chain gate passes for the
      # feature build, not just the default one.
      - name: cargo-deny accepts the opt-in zstd C-FFI under all-features
        uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2
        with:
          tool: cargo-deny@0.19.8
      - run: cargo deny check
      # The #77 musl static-link verification: the opt-in zstd C must be VENDORED and STATIC-linked
      # (the `pkg-config` feature is OFF, so zstd-sys compiles the bundled C source rather than
      # dynamically linking a system libzstd). Cross-build the `--features zstd` binary for musl and
      # assert it is still a static ELF (no PT_INTERP, no NEEDED), so the vendored zstd C did not
      # introduce a dynamic dependency.
      - name: zstd-feature musl static-link verification (#77)
        run: |
          set -euo pipefail
          target="x86_64-unknown-linux-musl"
          bin="target/${target}/release/ironbus"
          rm -f "$bin"
          cargo build --release --locked --features zstd -p ironbus-cli --target "$target"
          test -x "$bin"
          if readelf -l "$bin" | grep -q 'INTERP'; then
            echo "::error::the --features zstd musl binary has a PT_INTERP segment: zstd was dynamically linked, not vendored-static (#77)"
            exit 1
          fi
          if readelf -d "$bin" 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::the --features zstd musl binary lists NEEDED shared libs: zstd was not static-linked (#77)"
            exit 1
          fi
          echo "ok: the --features zstd musl binary is static (vendored zstd C is static-linked, #77)"
          # The feature graph DOES carry the vendored-C zstd-sys (the inverse of the default-graph
          # assertion in the SBOM job), proving the codec is present exactly when opted in.
          if cargo tree -p ironbus-cli --features zstd -e normal --target "$target" --prefix none --locked | grep -qi 'zstd-sys'; then
            echo "ok: zstd-sys is present in the feature graph (opt-in active)"
          else
            echo "::error::zstd-sys missing from the feature graph"
            exit 1
          fi

  fuzz-corpus:
    name: fuzz regression corpus is current (#385)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The committed, content-addressed regression corpus (fuzz/corpus-regression) is generated by
      # fuzz/seed-regression-corpus.sh from the frozen #45 conformance vectors plus crafted hostile
      # inputs. This re-derives it into a temp tree and diffs it against what is committed, so a hand
      # edit or a dropped seed fails here. The deterministic replay of every seed through the
      # decoders runs in the `test` job (crates/ironbus-server/tests/fuzz_regression_replay.rs), which
      # is the per-PR teeth; this job only guards the corpus's provenance. Zero network, never flaky.
      - name: assert the committed fuzz regression corpus is up to date
        run: sh fuzz/seed-regression-corpus.sh --check

  fuzz-smoke:
    name: fuzz smoke (regression replay, bounded)
    runs-on: ubuntu-latest
    # A bounded per-PR libFuzzer smoke: replay the committed regression corpus and fuzz each target
    # for a few seconds under ASan, so a crash-class regression is caught on the PR, not only in the
    # nightly soak. This is the LIGHT lane; the DEEP exploratory soak (180 s/target, raising toward
    # 30 min) stays in nightly.yml and is NOT weakened. Kept short so it never dominates PR latency
    # (30 min bounds 21 targets: one shared ASan build + ~15 s exploration each).
    timeout-minutes: 30
    env:
      # cargo-fuzz computes its own sanitizer RUSTFLAGS; clear the inherited "-D warnings" so it
      # builds from a clean slate rather than risking a clobber, exactly as the nightly fuzz job does.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: fuzz
          key: fuzz-smoke
      - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2
        with:
          tool: cargo-fuzz@0.13.1
      - name: replay the regression corpus and short-fuzz each target
        env:
          # Per-target wall-clock budget for the short exploratory leg AFTER the corpus replay.
          # Small on purpose (21 targets => ~5 min of fuzzing): the deep soak is nightly's job.
          MAX_TOTAL_TIME: "15"
        run: |
          set -euo pipefail
          # The target list is DERIVED from fuzz_targets/ (never hardcoded), exactly like the
          # nightly soak: a hardcoded list silently orphaned targets from every lane. A new fuzz
          # target is smoke-tested on the very PR that adds it; one missing its fuzz/Cargo.toml
          # [[bin]] entry fails the lane loudly.
          for target_file in fuzz/fuzz_targets/*.rs; do
            target="$(basename "${target_file}" .rs)"
            echo "::group::fuzz-smoke ${target}"
            corpus="corpus-regression/${target}"
            # A target with no committed regression corpus yet gets an (ephemeral) empty dir —
            # libFuzzer requires the positional corpus dir to exist; the replay leg is then a no-op
            # and the exploratory leg starts from scratch until seeds are promoted (#385).
            mkdir -p "fuzz/${corpus}"
            # FIRST replay the committed regression seeds deterministically (-runs=0: execute each
            # input once, mutate nothing), so a seed that now crashes fails fast and reproducibly.
            # `--target x86_64-unknown-linux-gnu` is REQUIRED: cargo-fuzz is binstalled as a
            # musl-static binary and otherwise defaults the fuzz build to musl, which is incompatible
            # with AddressSanitizer (PR #393). The nightly soak pins the same target for the same
            # reason; every fuzz build invocation here must too.
            ( cd fuzz && cargo +nightly fuzz run "${target}" --target x86_64-unknown-linux-gnu "${corpus}" -- -runs=0 )
            # THEN a short bounded exploratory leg, seeded by the same regression corpus, to surface a
            # shallow new crasher on the PR. Bounded by -max_total_time so the lane always finishes.
            ( cd fuzz && cargo +nightly fuzz run "${target}" --target x86_64-unknown-linux-gnu "${corpus}" -- -max_total_time="${MAX_TOTAL_TIME}" )
            echo "::endgroup::"
          done
      - name: upload any crashing input for triage
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-smoke-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Lint every workflow (CI, nightly, release) for schema, expression, and shell errors, so
      # a broken release workflow is caught here rather than at a tag where it cannot be retried
      # cheaply. actionlint runs shellcheck on each `run:` block.
      - name: install and run actionlint
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  dco:
    name: DCO sign-off
    # Merge-blocking DCO check (#128, #22): every commit on the PR must carry a Signed-off-by
    # trailer, per CONTRIBUTING.md. PR-only: a push to main has no PR commit range to check (the
    # range is the PR's own commits), and the merge queue re-runs this on the candidate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Need the PR commit range, so fetch enough history to walk base..head.
          fetch-depth: 0
      - name: every PR commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/ci/dco-check.sh "$BASE_SHA" "$HEAD_SHA"

  repro:
    name: byte-identical reproducibility gate (#101)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: repro
      - name: install musl tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      # The byte-identical reproducibility GATE (#101, acceptance: "two builds of the same commit
      # produce byte-identical binaries, enforced in CI"). It builds the SAME commit TWICE with the
      # exact reproducible invocation pinned in RELEASING.md (SOURCE_DATE_EPOCH from the commit date,
      # CARGO_INCREMENTAL=0, --locked, the --remap-path-prefix pair that strips the checkout dir and
      # cargo cache out of the embedded panic/track_caller/file!() strings) and asserts the two
      # binaries have an IDENTICAL SHA256.
      #
      # SINGLE-RUNNER, TWO-BUILD by design: the two builds run back to back on the SAME runner, with
      # a `cargo clean` between them so build two is a genuine fresh compile, not a cache replay. The
      # alternative (build on two DIFFERENT runners and diff) adds runner-variance risk (a differing
      # rustc patch, libc, or sysroot would fail the gate for a reason that is NOT a determinism
      # regression in our tree); a single runner holds the toolchain fixed, so a mismatch here is a
      # real determinism regression. The release workflow can still rebuild on a clean runner to
      # cross-check, but the per-PR GATE is the deterministic single-runner comparison. Verified
      # before this gate was added: `cargo build --release --locked` with this invocation is
      # byte-identical across an incremental rebuild AND a full `cargo clean` rebuild.
      #
      # diffoscope TRIAGE (documented, not run on the happy path): if this gate ever fails, rebuild
      # the two binaries locally and run `diffoscope b1 b2` to localize the differing bytes; the
      # usual culprits are a new embedded absolute path (extend the --remap-path-prefix set), a
      # build timestamp that ignores SOURCE_DATE_EPOCH, or parallel codegen creeping in
      # (codegen-units must stay 1). See RELEASING.md "The byte-identical gate".
      - name: build the same commit twice and assert byte-identical SHA256
        run: |
          set -euo pipefail
          target="x86_64-unknown-linux-musl"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          export CARGO_INCREMENTAL=0
          export RUSTFLAGS="-D warnings --remap-path-prefix=${PWD}=/ironbus --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          bin="target/${target}/release/ironbus"

          rm -f "$bin"
          cargo build --release --locked -p ironbus-cli --target "$target"
          test -x "$bin"
          sum1="$(sha256sum "$bin" | cut -d' ' -f1)"
          cp "$bin" /tmp/ironbus-build1

          # A genuine fresh rebuild of the SAME commit: drop the artifacts so build two recompiles.
          cargo clean --release --target "$target"
          rm -f "$bin"
          cargo build --release --locked -p ironbus-cli --target "$target"
          test -x "$bin"
          sum2="$(sha256sum "$bin" | cut -d' ' -f1)"

          echo "build 1 SHA256: $sum1"
          echo "build 2 SHA256: $sum2"
          if [ "$sum1" != "$sum2" ]; then
            echo "::error::reproducibility gate: the two builds of this commit differ ($sum1 != $sum2)."
            echo "::error::Triage: run 'diffoscope /tmp/ironbus-build1 ${bin}' to localize the differing bytes (see RELEASING.md)."
            exit 1
          fi
          echo "ok: byte-identical across two clean builds of this commit (SHA256 $sum1)"

  docs-links:
    name: docs relative-link + issue-index integrity (#30 #25)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The NEVER-FLAKY per-PR half of the #30 link integrity story: validate that every
      # IN-REPO relative doc link and every same-file / cross-file section ANCHOR resolves,
      # with ZERO network calls, so a moved doc, a typo'd path, or a stale anchor fails on the
      # PR deterministically. The external-URL reachability check (which can flake on a
      # third-party outage) is deliberately NOT run here; it is the weekly docs-link-check
      # cron (.github/workflows/docs-link-check.yml), which reports instead of blocking.
      - name: per-PR relative-link and anchor integrity (no network)
        run: sh scripts/ci/relative-link-check.sh
      # The STRUCTURAL half of the #25 issue-index audit: with no GH token in a PR context the
      # audit runs its offline checks only (the index parses, the 21 design parents are present
      # and back-link to the EPIC, every node's parent resolves in-index with no dangling/orphan
      # reference, and slugs are unique). The LIVE tracker cross-checks (milestone match, live
      # back-links, untracked-issue warnings) need `gh` and run on the weekly governance cron,
      # not here, because the tracker changes outside PRs. yq is preinstalled on the runner.
      - name: issue-index structural audit (offline)
        run: sh scripts/ci/issue-index-audit.sh
