name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  msrv:
    name: msrv (1.78)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-features --locked

  core-no-io:
    name: ironbus-core is IO-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: forbid filesystem, network, process, and async-runtime usage in sources
        run: |
          set -euo pipefail
          src=crates/ironbus-core
          bad=0
          grep -rnE --include='*.rs' '(tokio|async_std|smol|mio)::' "$src" && bad=1 || true
          grep -rnE --include='*.rs' 'use[[:space:]]+(tokio|async_std|smol|mio)([[:space:]]|;|::|$)' "$src" && bad=1 || true
          grep -rnE --include='*.rs' 'std::(fs|net|process)' "$src" && bad=1 || true
          grep -rnE --include='*.rs' 'use[[:space:]]+std::\{[^}]*(fs|net|process)' "$src" && bad=1 || true
          if [ "$bad" = "1" ]; then
            echo "::error::ironbus-core must stay IO-free (no filesystem, network, process, or async runtime)"
            exit 1
          fi
          echo "ironbus-core sources are IO-free"
      - name: forbid async-runtime crates in the ironbus-core dependency tree
        run: |
          set -euo pipefail
          deps="$(cargo tree -p ironbus-core -e normal,build --prefix none --locked | awk '{print $1}' | sort -u)"
          if echo "$deps" | grep -qxE 'tokio|mio|async-std|smol'; then
            echo "::error::ironbus-core must not depend on an async runtime"
            echo "$deps"
            exit 1
          fi
          echo "ironbus-core dependency tree is runtime-free"

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.8
      - run: cargo deny check

  spdx:
    name: SPDX headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every Rust source starts with the SPDX header
        run: |
          set -euo pipefail
          miss=0
          while IFS= read -r f; do
            head -3 "$f" | tr -d '\r' | grep -qF '// SPDX-License-Identifier: MIT OR Apache-2.0' || { echo "missing SPDX: $f"; miss=1; }
          done < <(git ls-files '*.rs')
          if [ "$miss" = "1" ]; then
            echo "::error::all Rust sources must start with: // SPDX-License-Identifier: MIT OR Apache-2.0"
            exit 1
          fi
          echo "all Rust sources carry the SPDX header"
