name: nightly

# The per-PR pipeline runs the crash gates and codec proptests at proptest's default case
# count; this nightly lane re-runs them with a far deeper sweep, so a rare non-determinism or
# a crash-class regression that only a specific seed exposes is caught within a day (#21, #123).
on:
  schedule:
    - cron: "0 4 * * *" # daily at 04:00 UTC
  workflow_dispatch: {} # manual trigger, also used to validate the lane on demand

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"

jobs:
  deep-sweep:
    name: deep crash-gate and codec sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: run the workspace tests with a deep proptest sweep
        env:
          # ~195x the proptest default (256), so the crash gates, recovery prefix checks,
          # determinism meta-test, the corruption corpus's single-bit-flip sweep (#123), and the
          # codec round-trips each explore far more inputs.
          PROPTEST_CASES: "50000"
        run: cargo test --workspace --all-features --locked

  fuzz:
    # Soak the untrusted-byte parsers under libFuzzer + AddressSanitizer (#21, #123). The crates'
    # proptests already round-trip structured inputs; this lane drives the raw decoders with
    # coverage-guided random bytes so an out-of-bounds read or a panic on a hostile or corrupt
    # input surfaces here. A crash exits cargo-fuzz non-zero and fails the run; the offending
    # input is uploaded so it can be minimized into a permanent regression seed.
    name: fuzz soak (parsers)
    runs-on: ubuntu-latest
    env:
      # cargo-fuzz computes its own sanitizer RUSTFLAGS; clear the inherited "-D warnings" so it
      # builds from a clean slate rather than risking a clobber or append ambiguity across versions.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # latest nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2
        with:
          tool: cargo-fuzz@0.13.1
      - name: soak each parser fuzz target
        env:
          # Per-target wall-clock budget; 13 targets => ~39 min of fuzzing per nightly run. The #385
          # plan is to raise this toward 30 min/target; it is a single knob so deepening the soak is
          # a one-line change once the nightly runner-time budget allows.
          MAX_TOTAL_TIME: "180"
        run: |
          # Select nightly explicitly via the rustup proxy: cargo-fuzz needs the nightly
          # sanitizer (-Zsanitizer=address). dtolnay/rust-toolchain does run `rustup default
          # nightly`, but that step is continue-on-error, so the `+nightly` makes the
          # toolchain unambiguous and matches the documented local command in fuzz/README.md.
          for target in record_codec frame_decode cursor_snapshot seq_snapshot segment_scan segment_scan_compacted pub_body ack_body deliver_body dead_letter_body connect_body info_body gap_marker_body; do
            echo "::group::fuzz ${target}"
            # Pin the fuzz build to the rustc HOST target (gnu), not cargo-fuzz's self-detected
            # default. cargo-fuzz infers its default --target from its OWN binary triple, and
            # taiki-e/install-action now binstalls the musl-static cargo-fuzz build, so without
            # this flag it builds the fuzz targets for x86_64-unknown-linux-musl. AddressSanitizer
            # is incompatible with a statically linked libc (and the musl std for the sanitizer
            # build is not installed), so the build failed with "sanitizer is incompatible with
            # statically linked libc". The host gnu target is always installed by the toolchain.
            #
            # The committed regression corpus (fuzz/corpus-regression/<target>, #385) is passed as
            # the seed corpus, so the soak always REPLAYS every #45 vector and every promoted crasher
            # first, then explores from them rather than from an empty corpus each night.
            cargo +nightly fuzz run "${target}" --target x86_64-unknown-linux-gnu \
              "corpus-regression/${target}" -- -max_total_time="${MAX_TOTAL_TIME}"
            echo "::endgroup::"
          done
        working-directory: fuzz
      # Minimize-and-promote (#385): on a crash, cargo-fuzz drops the offending input under
      # fuzz/artifacts/<target>/. Upload it with a 90-day retention (the external-artifact retention
      # policy this task calls for) so a triager can fetch it. The PROMOTE flow is manual and cheap:
      #   cd fuzz && cargo +nightly fuzz tmin <target> --target x86_64-unknown-linux-gnu <crash-file>
      #   cp <minimized> corpus-regression/<target>/"$(sha256sum <minimized> | cut -d' ' -f1)"
      # which makes the minimized crasher a permanent, content-addressed per-PR regression seed (the
      # replay test then guards it on every PR). See fuzz/README.md "Minimize and promote".
      - name: upload crashing inputs for triage
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 90

  miri:
    # Run Miri (the MIR interpreter) over the crates it CAN run, to catch undefined behavior the
    # native test run cannot see: out-of-bounds reads, use-after-free, invalid pointer arithmetic,
    # and data races in the codecs and the in-memory simulation (#21). Miri interprets the program,
    # so it cannot execute tests that spawn a process, touch a real file, or do real networking.
    # The lane is therefore scoped to the IO-free and in-memory-simulation paths only:
    #   - ironbus-core is fully IO-free (a CI gate forbids fs/net/process there), so its whole lib
    #     test set runs under Miri.
    #   - ironbus-storage's lib tests are split: the InMemoryFile / InMemoryFs simulation tests do
    #     no real IO and run under Miri, while the StdFs / real-directory tests (the `std_file_tests`
    #     and `std_tests` modules and the three `*_on_a_real_directory` / `stdfs_*` cases in log.rs)
    #     open real files through foreign functions Miri cannot interpret, so they are skipped by
    #     name below. The integration tests (which boot the real `ironbus` binary) are out of scope
    #     because we run only `--lib`.
    name: miri (IO-free and in-memory paths)
    runs-on: ubuntu-latest
    env:
      # proptest's default failure-persistence calls getcwd to locate the source file, which Miri
      # rejects under its default isolation, aborting the test binary. Disable isolation so the
      # in-memory proptests run. Safe here: the job runs only `--lib` over the IO-free core and the
      # in-memory storage simulation (the real-IO tests are skipped), so no test does real host IO.
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: miri
      - name: miri-test ironbus-core (fully IO-free)
        run: cargo +nightly miri test -p ironbus-core --lib
      - name: miri-test ironbus-storage in-memory simulation lib tests
        # Skip the real-IO lib tests by name: the `std_file_tests` (io.rs) and `std_tests`
        # (fs.rs, naming.rs) modules and the three real-directory cases in log.rs open real
        # files through foreign functions Miri cannot interpret. Everything else is the
        # InMemoryFile / InMemoryFs simulation, which Miri runs cleanly with isolation ON.
        run: |
          cargo +nightly miri test -p ironbus-storage --lib -- \
            --skip std_file_tests:: \
            --skip std_tests:: \
            --skip stdfs_read_across_segments \
            --skip rolling_and_recovery_on_a_real_directory \
            --skip reap_and_recovery_on_a_real_directory

  loom:
    # Scoped loom concurrency models (#122): exhaustively permute the interleavings of the three
    # concurrency patterns the cross-thread paths rely on (the commit-index publish/observe, the
    # bounded WAL handoff, and the segment/connection refcount) under `RUSTFLAGS="--cfg loom"`. The tests live in the
    # STANDALONE, SEPARATE-WORKSPACE dev-only `loom-tests` crate
    # (`tools/loom-tests/tests/loom_concurrency.rs`), gated `#![cfg(loom)]`, with `loom` as a
    # `cfg(loom)` dev-dependency. That crate has its OWN Cargo.lock and is EXCLUDED from the root
    # workspace, so loom (and loom's `tracing-subscriber`/`env-filter` tree) never enters the root
    # lockfile, the shipped graph, or the cargo-auditable SBOM. Each model caps at <= 3 threads and
    # <= 4 ops, and `LOOM_MAX_PREEMPTIONS=3` bounds the exploration so the lane always finishes well
    # inside the budget. Non-blocking by virtue of living in the nightly lane.
    name: loom scoped concurrency models
    runs-on: ubuntu-latest
    env:
      # Build the loom tests (and pull the cfg-gated loom dev-dependency) only here. Bound the
      # thread-preemption exploration so the factorial state space stays tractable (#122).
      RUSTFLAGS: "--cfg loom -D warnings"
      LOOM_MAX_PREEMPTIONS: "3"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: loom
          # The loom models are a separate workspace under tools/loom-tests with their own lockfile.
          workspaces: tools/loom-tests
      - name: run the scoped loom concurrency models
        # The separate workspace is addressed by its manifest path (no root-workspace coupling).
        # Single-threaded so each model's interleaving count prints in order; --nocapture surfaces
        # the per-model "[loom] <name>: explored N interleavings" proof line in the job log.
        run: cargo test --manifest-path tools/loom-tests/Cargo.toml --locked --test loom_concurrency -- --nocapture --test-threads=1

  coverage:
    # Produce an informational LCOV coverage report for the workspace with cargo-llvm-cov and
    # upload it as a build artifact (#21). This lane is informational only: it has no threshold
    # gate and adds no external coverage service or token. It succeeds as long as coverage is
    # collected, so a drop in coverage is visible in the artifact without ever blocking a merge.
    #
    # COVERAGE-REGRESSION GATE (#385, intended mechanism, documented here, NOT yet enforcing):
    # the planned "coverage-below-last-release" gate compares this run's line coverage against the
    # coverage archived for the last released tag and fails on an un-ratified drop. It is NOT wired
    # as a hard gate yet for the SAME reason the #114 perf regression gate no-ops today: there is no
    # released tag / baseline yet (v0.1.0 is the maintainer's action), so there is nothing to compare
    # against. What IS wired cheaply now: this job emits the summary percentage to the job log and
    # the step summary every night, and retains the lcov.info artifact for 90 days, so a release can
    # archive a baseline lcov.info and a future revision of this job can flip the comparison on
    # (read the baseline percentage, FAIL if `current < baseline - tolerance`), mirroring the perf
    # gate's baseline/no-op/ratify shape. Documented in fuzz/README.md and CHANGELOG.
    name: coverage (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: coverage
      - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2
        with:
          tool: cargo-llvm-cov
      - name: collect workspace coverage to lcov.info
        # The instrumented build sets its own coverage RUSTFLAGS; clear the inherited
        # "-D warnings" so it builds from a clean slate rather than risking a clobber.
        env:
          RUSTFLAGS: ""
        run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info
      - name: summarize line coverage (the number a future below-last-release gate would compare)
        # Deterministic, dependency-free: derive the overall line-coverage percentage straight from
        # the LCOV LF/LH counters and print it to the log and the step summary. This is the single
        # value the documented coverage-regression gate (#385) would check against the last release's
        # archived baseline; emitting it now makes the baseline trivially recoverable later.
        run: |
          set -euo pipefail
          total_lf=$(awk -F: '/^LF:/ {s+=$2} END {print s+0}' lcov.info)
          total_lh=$(awk -F: '/^LH:/ {s+=$2} END {print s+0}' lcov.info)
          if [ "$total_lf" -eq 0 ]; then
            echo "::warning::no instrumented lines found in lcov.info"
            pct="0.00"
          else
            pct=$(awk -v lh="$total_lh" -v lf="$total_lf" 'BEGIN { printf "%.2f", (lh*100.0)/lf }')
          fi
          echo "line coverage: ${pct}% (${total_lh}/${total_lf} lines)"
          echo "line coverage: ${pct}% (${total_lh}/${total_lf} lines)" >> "$GITHUB_STEP_SUMMARY"
      - name: upload the coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 90
