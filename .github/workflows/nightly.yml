name: nightly

# The per-PR pipeline runs the crash gates and codec proptests at proptest's default case
# count; this nightly lane re-runs them with a far deeper sweep, so a rare non-determinism or
# a crash-class regression that only a specific seed exposes is caught within a day (#21, #123).
on:
  schedule:
    - cron: "0 4 * * *" # daily at 04:00 UTC
  workflow_dispatch: {} # manual trigger, also used to validate the lane on demand

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"

jobs:
  deep-sweep:
    name: deep crash-gate and codec sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: run the workspace tests with a deep proptest sweep
        env:
          # ~195x the proptest default (256), so the crash gates, recovery prefix checks,
          # determinism meta-test, and codec round-trips each explore far more inputs.
          PROPTEST_CASES: "50000"
        run: cargo test --workspace --all-features --locked

  fuzz:
    # Soak the untrusted-byte parsers under libFuzzer + AddressSanitizer (#21, #123). The crates'
    # proptests already round-trip structured inputs; this lane drives the raw decoders with
    # coverage-guided random bytes so an out-of-bounds read or a panic on a hostile or corrupt
    # input surfaces here. A crash exits cargo-fuzz non-zero and fails the run; the offending
    # input is uploaded so it can be minimized into a permanent regression seed.
    name: fuzz soak (parsers)
    runs-on: ubuntu-latest
    env:
      # cargo-fuzz computes its own sanitizer RUSTFLAGS; clear the inherited "-D warnings" so it
      # builds from a clean slate rather than risking a clobber or append ambiguity across versions.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # latest nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2
        with:
          tool: cargo-fuzz@0.13.1
      - name: soak each parser fuzz target
        env:
          # Per-target wall-clock budget; 4 targets => ~12 min of fuzzing per nightly run.
          MAX_TOTAL_TIME: "180"
        run: |
          # Select nightly explicitly via the rustup proxy: cargo-fuzz needs the nightly
          # sanitizer (-Zsanitizer=address). dtolnay/rust-toolchain does run `rustup default
          # nightly`, but that step is continue-on-error, so the `+nightly` makes the
          # toolchain unambiguous and matches the documented local command in fuzz/README.md.
          for target in record_codec frame_decode cursor_snapshot segment_scan; do
            echo "::group::fuzz ${target}"
            cargo +nightly fuzz run "${target}" -- -max_total_time="${MAX_TOTAL_TIME}"
            echo "::endgroup::"
          done
      - name: upload crashing inputs for triage
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
