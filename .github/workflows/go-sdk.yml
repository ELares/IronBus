# Go SDK gate (#1021): gofmt / vet / build / test for the standalone module at
# sdk/go. The tests here are the golden-frame vector conformance suite (the
# committed corpus under sdk/go/internal/wire/testdata, exported by the Rust
# reference encoders) — deliberately NOT the live-broker integration tests,
# which are env-gated OFF (IRONBUS_LIVE) because CI has no release binary;
# building one per PR would roughly double this job's cost for coverage the
# Rust acceptance gate already provides. Run them locally with:
#   cargo build --release && cd sdk/go && IRONBUS_LIVE=1 go test ./...
name: Go SDK

on:
  pull_request:
    paths:
      - "sdk/go/**"
      - ".github/workflows/go-sdk.yml"
  push:
    branches: [main]
    paths:
      - "sdk/go/**"
      - ".github/workflows/go-sdk.yml"

permissions:
  contents: read

concurrency:
  group: go-sdk-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: gofmt + vet + build + vectors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: sdk/go/go.sum
      - name: gofmt (no diffs)
        run: |
          diffs=$(gofmt -l .)
          if [ -n "$diffs" ]; then
            echo "gofmt needed on:" >&2
            echo "$diffs" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build (SDK + examples)
        run: go build ./...
      - name: go test (golden-frame vector conformance)
        run: go test ./...
