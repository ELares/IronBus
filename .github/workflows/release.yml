name: Release

# Build, sign, and publish the static musl edge binaries for a tagged release (#17, #22, #103).
#
# DORMANT BY DESIGN: this workflow runs only on a `v*` tag push (the maintainer's action) or a
# manual `workflow_dispatch` against an existing tag. Opening or merging a PR triggers nothing, so
# this file publishes no release until a tag is cut.
#
# The three triples match the CI `cross-build` matrix, so the release path reuses the same proven
# static-link setup, and it builds with the reproducible invocation pinned in RELEASING.md (#101):
# `SOURCE_DATE_EPOCH` from the tag commit, the `--remap-path-prefix` RUSTFLAGS, and `--locked`.
# Each release ships the three binaries, a per-binary SHA256, one consolidated `SHA256SUMS`, a
# cargo-auditable SBOM, and a keyless Sigstore build-provenance attestation over every artifact
# (verifiable with `gh attestation verify`, per SECURITY.md). The fail-closed installer (#103)
# consumes these assets. The `.deb` package (one per triple, `package-deb` job) and the distroless
# container image (`container` job) are built FROM the verified binaries (no recompile), so all four
# distribution channels (#104) ride the same reproducible bytes; see docs/DISTRIBUTION.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build the release for"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}
      - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2
        with:
          tool: cross
      - name: cross build the static ironbus binary (reproducible invocation)
        run: |
          set -euo pipefail
          # The reproducible release invocation pinned in RELEASING.md (#101): pin every
          # determinism input so an operator can rebuild this tag and match it byte for byte.
          # SOURCE_DATE_EPOCH is the tag commit's date (not the runner wall clock); the
          # --remap-path-prefix pair drops the checkout dir and the cargo cache out of the
          # binary's embedded panic/track_caller/file!() strings; --locked uses the committed
          # Cargo.lock. CARGO_INCREMENTAL=0 is pinned in .cargo/config.toml. Cross.toml forwards
          # SOURCE_DATE_EPOCH and RUSTFLAGS into the cross container.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          export RUSTFLAGS="-D warnings --remap-path-prefix=${PWD}=/ironbus --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          # Inspect only a freshly produced artifact, never a stale cached one.
          rm -f "target/${{ matrix.target }}/release/ironbus"
          cross build --release --locked -p ironbus-cli --target "${{ matrix.target }}"
      - name: assert the binary is statically linked
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/ironbus"
          test -x "$bin"
          # A static (including static-PIE) ELF carries no PT_INTERP segment and no NEEDED lib.
          if readelf -l "$bin" | grep -q 'INTERP'; then
            echo "::error::$bin has a PT_INTERP segment, it is dynamically linked"
            exit 1
          fi
          if readelf -d "$bin" 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::$bin lists NEEDED shared libraries, it is not static"
            exit 1
          fi
      - name: stage the artifact and its checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          out="dist/ironbus-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/ironbus" "$out"
          # The per-binary .sha256 is named with the bare asset name so `sha256sum -c` works from
          # the download dir; the consolidated SHA256SUMS is built once in the publish job.
          ( cd dist && sha256sum "ironbus-${{ matrix.target }}" > "ironbus-${{ matrix.target }}.sha256" )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ironbus-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  package-deb:
    name: package .deb (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            deb_arch: amd64
          - target: aarch64-unknown-linux-musl
            deb_arch: arm64
          - target: armv7-unknown-linux-musleabihf
            deb_arch: armhf
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2
        with:
          tool: cargo-deb
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ironbus-${{ matrix.target }}
          path: dist
      - name: build the .deb from the verified static binary (no recompile)
        env:
          TARGET: ${{ matrix.target }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          set -euo pipefail
          # Stage the ALREADY-BUILT static musl binary where the [package.metadata.deb] assets map
          # expects it WITH `--target`: cargo-deb reads the `target/release/ironbus` asset relative to
          # `target/<triple>/`, i.e. `target/<triple>/release/ironbus`, and it infers the Debian
          # `Architecture` from the `--target` triple (amd64/arm64/armhf), NOT from the host. Without
          # `--target` every leg would label `amd64` (the ubuntu-latest host), so the aarch64/armv7
          # .debs would declare amd64 and `dpkg -i` would refuse them on an arm node. We pass the
          # per-triple binary and `--target`, matching docs/DISTRIBUTION.md. --no-build skips the
          # compile (ships the exact reproducible release bytes, not a fresh glibc rebuild);
          # --no-strip preserves the embedded SBOM and the reproducible bytes.
          mkdir -p "target/${TARGET}/release"
          install -m 0755 "dist/ironbus-${TARGET}" "target/${TARGET}/release/ironbus"
          cargo deb -p ironbus-cli --target "${TARGET}" --no-build --no-strip \
            --output "dist/ironbus-${TARGET}.deb"
          ls -l dist/*.deb
          # A self-check: dpkg-deb can parse the package and it lists the binary, the unit, and the
          # conffile, so a broken metadata change is caught at the tag, not on a device.
          dpkg-deb -I "dist/ironbus-${TARGET}.deb"
          dpkg-deb -c "dist/ironbus-${TARGET}.deb" | grep -E 'usr/bin/ironbus|ironbus.service|etc/ironbus/ironbus.env'
          # ASSERT the Debian Architecture matches this leg's triple. A mislabeled .deb (the amd64-for-
          # everything bug) now FAILS the job instead of shipping a package an arm `dpkg -i` rejects.
          actual_arch="$(dpkg-deb -f "dist/ironbus-${TARGET}.deb" Architecture)"
          if [ "${actual_arch}" != "${DEB_ARCH}" ]; then
            echo "::error::ironbus-${TARGET}.deb declares Architecture '${actual_arch}', expected '${DEB_ARCH}'"
            exit 1
          fi
          echo "ironbus-${TARGET}.deb Architecture = ${actual_arch} (matches ${DEB_ARCH})"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ironbus-deb-${{ matrix.target }}
          path: dist/ironbus-${{ matrix.target }}.deb
          if-no-files-found: error

  container:
    name: distroless container image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to ghcr.io when publishing is enabled
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ironbus-x86_64-unknown-linux-musl
          path: dist
      - name: build the distroless image from the verified static binary
        run: |
          set -euo pipefail
          # Build FROM the verified release artifact (Dockerfile.release copies it in, no recompile),
          # so the image carries the exact reproducible bytes the `build` job produced. This always
          # runs, proving the Dockerfile is valid and the binary runs as the non-root user.
          # The downloaded artifact lost its Unix +x bit (upload/download-artifact do not preserve
          # it), so restore it before the build. Dockerfile.release also does `COPY --chmod=0755`, so
          # the image entrypoint is executable even if a future build path drops this; together the
          # `docker run ... --version` smoke below can never fail permission-denied on the binary.
          chmod 0755 "dist/ironbus-x86_64-unknown-linux-musl"
          docker build -f Dockerfile.release \
            --build-arg IRONBUS_BIN=dist/ironbus-x86_64-unknown-linux-musl \
            -t "ironbus:${{ github.event.inputs.tag || github.ref_name }}" .
          # Smoke: the non-root entrypoint runs (--version is a pure stdout-and-exit, no data dir).
          docker run --rm "ironbus:${{ github.event.inputs.tag || github.ref_name }}" --version
      # Registry publishing is OPT-IN (#334): it needs an org-level registry login and is a no-op
      # unless the `IRONBUS_PUBLISH_IMAGE` repository variable is set to `true`, so the build above
      # always gates the Dockerfile while the credentialed push stays a deliberate, separately-enabled
      # step.
      - name: log in to ghcr.io and push (opt-in)
        if: vars.IRONBUS_PUBLISH_IMAGE == 'true'
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          repo="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          docker tag "ironbus:${TAG}" "${repo}:${TAG}"
          docker push "${repo}:${TAG}"

  publish:
    name: publish release
    needs: [build, package-deb]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub Release
      id-token: write # keyless Sigstore signing via OIDC
      attestations: write # store the build-provenance attestation
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-sbom
      - name: generate the cargo-auditable SBOM
        run: |
          set -euo pipefail
          # The dependency graph is target-independent for this pure-Rust workspace, so one
          # auditable build yields the released SBOM (the same crates ship in every triple).
          cargo install --locked cargo-auditable rust-audit-info
          cargo auditable build --release --locked -p ironbus-cli
          mkdir -p dist
          rust-audit-info target/release/ironbus > dist/ironbus.sbom.json
          test -s dist/ironbus.sbom.json
          grep -q 'ironbus-core' dist/ironbus.sbom.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: collect the artifacts and build the consolidated SHA256SUMS
        run: |
          set -euo pipefail
          # The per-target upload-artifact entries each carry the binary plus its own .sha256; copy
          # only the binaries into dist (the consolidated SHA256SUMS replaces the per-binary files
          # as the installer's source of truth), and the per-target .deb (built by package-deb from
          # the same verified binary), then build one SHA256SUMS over all three binaries AND the
          # three .deb packages so the checksummed-release channel covers the .deb too.
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf; do
            cp "artifacts/ironbus-${t}/ironbus-${t}" "dist/ironbus-${t}"
            cp "artifacts/ironbus-${t}/ironbus-${t}.sha256" "dist/ironbus-${t}.sha256"
            cp "artifacts/ironbus-deb-${t}/ironbus-${t}.deb" "dist/ironbus-${t}.deb"
          done
          ( cd dist && sha256sum \
              ironbus-x86_64-unknown-linux-musl \
              ironbus-aarch64-unknown-linux-musl \
              ironbus-armv7-unknown-linux-musleabihf \
              ironbus-x86_64-unknown-linux-musl.deb \
              ironbus-aarch64-unknown-linux-musl.deb \
              ironbus-armv7-unknown-linux-musleabihf.deb \
              > SHA256SUMS )
          # Self-check: the consolidated file must verify before it ships, so a bad upload can
          # never produce a release whose SHA256SUMS does not match its own binaries.
          ( cd dist && sha256sum -c SHA256SUMS )
          ls -l dist
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          # Keyless Sigstore build-provenance over every shipped artifact, per SECURITY.md. The
          # SHA256SUMS is attested too, so a verifier can anchor the whole set to one provenance.
          subject-path: |
            dist/ironbus-x86_64-unknown-linux-musl
            dist/ironbus-aarch64-unknown-linux-musl
            dist/ironbus-armv7-unknown-linux-musleabihf
            dist/ironbus-x86_64-unknown-linux-musl.deb
            dist/ironbus-aarch64-unknown-linux-musl.deb
            dist/ironbus-armv7-unknown-linux-musleabihf.deb
            dist/SHA256SUMS
            dist/ironbus.sbom.json
      - name: determine prerelease (0.x is a prerelease)
        id: prerelease
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Mark 0.x (and 0.0.0) tags as prereleases. The version derives from the tag: a leading
          # `v0.` (or the bare `v0`) is pre-1.0 and not yet a stability promise (see SECURITY.md).
          case "$TAG" in
            v0.*|v0) echo "value=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "value=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
          PRERELEASE: ${{ steps.prerelease.outputs.value }}
        run: |
          set -euo pipefail
          prerelease_flag=""
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_flag="--prerelease"
          fi
          # shellcheck disable=SC2086
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --verify-tag \
            $prerelease_flag \
            --notes "Static musl binaries for the three edge triples (x86_64, aarch64, armv7) and a .deb package per triple, each with a SHA256 checksum, a consolidated SHA256SUMS (over the binaries and the .deb packages), a cargo-auditable SBOM (ironbus.sbom.json), and a keyless Sigstore build-provenance attestation over every artifact. Verify integrity with: sha256sum -c SHA256SUMS, and provenance with: gh attestation verify <artifact> --repo $REPO. The fail-closed installer (scripts/install.sh) verifies the checksum before installing; the distroless container image is built and (opt-in) published by the release workflow. See docs/DISTRIBUTION.md for all four channels and CHANGELOG.md for changes." \
            dist/ironbus-x86_64-unknown-linux-musl \
            dist/ironbus-x86_64-unknown-linux-musl.sha256 \
            dist/ironbus-aarch64-unknown-linux-musl \
            dist/ironbus-aarch64-unknown-linux-musl.sha256 \
            dist/ironbus-armv7-unknown-linux-musleabihf \
            dist/ironbus-armv7-unknown-linux-musleabihf.sha256 \
            dist/ironbus-x86_64-unknown-linux-musl.deb \
            dist/ironbus-aarch64-unknown-linux-musl.deb \
            dist/ironbus-armv7-unknown-linux-musleabihf.deb \
            dist/SHA256SUMS \
            dist/ironbus.sbom.json
