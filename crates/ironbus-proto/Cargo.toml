[package]
name = "ironbus-proto"
description = "Wire protocol frames and codecs for IronBus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dev-dependencies]
proptest = "1"
criterion = "0.5"
# TEST-ONLY (#1021): the Go-SDK golden-vector exporter compresses one deliver-path payload with the
# SAME pure-Rust lz4 block codec ironbus-core stores with (ADR-0003), so the exported
# `deliver_compressed` vector is byte-for-byte what a broker delivers. Kept on the ironbus-core
# version line; never a runtime dependency of the proto crate.
lz4_flex = { version = "0.11.6", default-features = false, features = ["safe-encode", "safe-decode", "checked-decode"] }

[lints]
workspace = true

# Informational micro-bench (#541): the framing + write overhead a DeliverBatch removes versus N
# per-record Deliver frames over a contiguous run. Run on demand (`cargo bench -p ironbus-proto`), NOT
# in per-PR CI; the full consume-vs-NATS leg is #554.
[[bench]]
name = "deliver_batch_framing"
harness = false
