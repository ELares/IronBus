[package]
name = "ironbus-storage"
description = "Storage engine for IronBus: segmented log, durability, recovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# DEFAULT: no feature. The shipped storage engine is pure Rust (ADR-0003); the dictionary sidecar
# IO and the zstd codec are pulled ONLY by the opt-in `zstd` feature below, so the default graph is
# unchanged.
default = []
# OPT-IN zstd: forwards ironbus-core's `zstd` feature so the on-disk dictionary sidecar store
# (`dicts/<dict_id>.zstd`) and the zstd codec compile in. NON-DEFAULT, off the default build (#357).
zstd = ["ironbus-core/zstd"]
# OPT-IN encryption (#780, ADR pending): links the PURE-RUST RustCrypto AEAD stack (aes-gcm +
# chacha20poly1305, over the `aead` trait) that performs the at-rest encryption of segment record
# payloads. NON-DEFAULT and excludable from `edge-min`, exactly like the `tls` feature — but UNLIKE
# `tls` it pulls NO C-FFI (no `ring`/`aws-lc-sys`): the AEAD primitives are pure Rust, MIT/Apache-2.0,
# already covered by the deny.toml license allow-list, so the default build AND this feature stay
# `cargo deny check`-clean and the static musl binary stays reproducible. The on-disk FORMAT support
# (the `ENCRYPTED` record flag, the `SEGMENT_FLAG_ENCRYPTED` header flag, `aead_suite`/`key_id`, the
# `UnknownKeyId`/`AeadTagMismatch` reason codes, and the encrypted-frame codec) lives in
# always-linked `ironbus-core`/`loss`, so even a DEFAULT (no-encryption) build DETECTS an encrypted
# segment and fail-closes on it; only the AEAD primitives and the key loader are behind this feature.
encryption = ["dep:aes-gcm", "dep:chacha20poly1305", "dep:zeroize"]
# OPT-IN s3 (#643 phase 2): the S3 cold-segment offload backend. A small, PURPOSE-BUILT S3 client (the
# four ColdStore verbs = four S3 requests: PUT/GET/DELETE/HEAD — no XML response parsing) with SigV4
# request signing over aws-lc-rs and HTTPS over the SAME rustls + aws-lc-rs stack the `tls` feature
# already ships. NON-DEFAULT and excludable from `edge-min` exactly like `tls`/`zstd`/`encryption`. It
# pulls NO new crate into the tree — every dependency below is already in the workspace lock (from the
# TLS stack + the otlp exporter) — so the DEFAULT graph stays clean and MSRV-1.78 + cargo-deny are
# unaffected. Crucially it links NO `ring` and NO XML parser: the crypto is aws-lc-rs only (ADR-0004),
# whose vendored-C `aws-lc-sys` is the SAME feature-scoped C-FFI the `tls` feature already allow-lists
# in deny.toml (so NO deny.toml change is needed and `ring`/`openssl-sys`/`native-tls` stay banned).
s3 = [
    "dep:aws-lc-rs",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:tokio-rustls",
    "dep:tokio",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http",
    "dep:http-body-util",
    "dep:tracing",
    "dep:zeroize",
]

[dependencies]
# `arc-swap` backs the lock-free off-actor consume READ plane (#539): the writer swaps in an
# immutable sealed-prefix snapshot (a Release store) and any number of reader threads `load` it
# wait-free (Acquire), so a consume read takes the snapshot with NO lock and NO append-actor
# round-trip. Same crate and publish pattern as the #651 routing trie in `ironbus-core`
# (`ArcSwap<Sublist>`). Pure Rust, no build script, `default-features = false` to keep the static
# edge binary lean; already in the workspace lock as a direct dependency of `ironbus-core`.
arc-swap = { version = "1.7", default-features = false }
crc32c = "0.6"
# `bytes::Bytes` lets an `OwnedRecord` carry REFCOUNTED slices of the segment read buffer instead of
# three per-record `Vec` deep copies (#480): a `read_from` reads the region into ONE buffer and each
# materialized record's key/headers/payload is a `Bytes::slice_ref` (a refcount bump, byte-identical),
# so a multi-record read is one alloc + refcounted slices, not O(records) allocs + O(bytes) copied, on
# the consume hot path. `bytes` is pure Rust (no `links`, no C build script), already in the workspace
# tree (a direct dependency of `ironbus-server`), and is on the pure-Rust data-path allow-list.
bytes = { version = "1", default-features = false }
ironbus-core = { path = "../ironbus-core", version = "0.1.0" }
# `serde` (derive only) makes the structured loss report (`loss::LossReport`) a versioned,
# stable, fixture-assertable artifact (#120). Kept derive-only so the static edge binary stays
# small: the JSON format crate (`serde_json`) is a dev-dependency, not shipped in the binary.
serde = { version = "1", features = ["derive"] }

# At-rest AEAD encryption (#780), the OPT-IN `encryption` feature only. PURE RUST (RustCrypto), no
# C-FFI, MIT OR Apache-2.0 — already on the deny.toml license allow-list and NOT on its `[bans]`
# denylist (contrast the feature-scoped `aws-lc-sys`/`zstd-sys` C-FFI allowances the TLS/zstd features
# need; this path needs none). Pinned to the 0.10 AEAD line, which shares the `generic-array` 0.14 /
# `crypto-common` 0.1 / `subtle` 2 / `zeroize` 1.8 scaffolding already in the lock (from the server
# auth crypto) and is comfortably MSRV-1.78-safe (the edition-2024 churn is in the 0.11+/aead-0.6
# line, deliberately avoided). `default-features = false`: no `getrandom`/`std` provider is pulled —
# the at-rest nonce is DETERMINISTIC (segment_id || record_counter), so NO RNG is linked. `aes-gcm`
# selects AES-256-GCM where the runtime reports hardware AES; `chacha20poly1305` is the portable
# constant-time fallback; the suite is chosen at startup and recorded in the segment header.
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"], optional = true }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"], optional = true }
# Zeroize the 32-byte key material on drop so a loaded key does not linger in freed heap. Pinned to
# match the server's `=1.8.2` so the lock unifies to one `zeroize`.
zeroize = { version = "1.8.2", default-features = false, optional = true }

# The S3 cold-segment backend (#643 phase 2), the OPT-IN `s3` feature ONLY. EVERY crate here is already
# in the workspace lock (pulled by the server/client TLS stack + the otlp exporter), so the `s3` feature
# adds ZERO new crates: MSRV-1.78 and cargo-deny are unaffected, and the DEFAULT graph is untouched.
# `aws-lc-rs` provides the SigV4 HMAC-SHA256 + SHA256 primitives (ADR-0004's crypto provider; its
# vendored-C `aws-lc-sys` is the SAME feature-scoped C-FFI the `tls` feature already allow-lists in
# deny.toml — NO deny change, and `ring` stays banned + unreachable). `rustls`/`tokio-rustls` are built
# `default-features = false` + `aws-lc-rs` so they carry aws-lc-rs and NEVER ring (exactly like the
# server/client TLS 1.3-only stack); `rustls-pki-types` (`pem`) parses the CA trust anchor. `hyper`
# (http1 client) + `hyper-util` (the tokio IO adapter) + `http` + `http-body-util` are the minimal HTTP
# surface. `tokio` (rt+net+time+io-util) is the current-thread runtime bridging the async client to the
# sync ColdStore trait.
aws-lc-rs = { version = "1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"], optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "io-util"], optional = true }
hyper = { version = "1", default-features = false, features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"], optional = true }
http = { version = "1", default-features = false, optional = true }
http-body-util = { version = "0.1", default-features = false, optional = true }
# The `s3` feature only: `tracing` for the plaintext-http-credentials warning (already in the lock via
# the server); `zeroize` (already declared above for `encryption`) to wipe the derived SigV4 signing
# key from memory after signing. Both pure Rust, already in the lock — no new crate.
tracing = { version = "0.1", default-features = false, optional = true }

# The cross-platform segment-preallocation primitive (#330, `docs/PREALLOCATION.md`) needs the
# per-OS reservation syscall (Linux `posix_fallocate`, macOS `fcntl(F_PREALLOCATE)`). `libc` is the
# raw binding only (no vendored C), is already in the workspace tree (pulled by `ironbus-cli`'s
# `ctrlc` and used directly by `ironbus-bench`), is MIT/permissive, and is on the `deny.toml`
# pure-Rust-syscall allow-list, so it adds no new C build and keeps the #139 pure-Rust data path.
# Unix-only and `cfg`-gated: the production targets are Linux musl and macOS, and `StdFile` itself
# is `cfg(unix)`; off Unix the trait's default no-op preallocate runs, so the workspace still builds.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Informational micro-benches only (the WAL-append framing hot path, #386 / #112 residual). Criterion
# is a DEV-dependency: it never enters the shipped binary's dependency graph (the static edge binary
# stays small), it is run on demand via `cargo bench -p ironbus-storage`, and it is not wired into
# per-PR CI; the regression gate is #114.
criterion = "0.5"
proptest = "1"
serde_json = "1"
tempfile = "3"

[lints]
workspace = true

# Informational micro-bench for the WAL append framing hot path (#386 / #112 residual). Run on demand
# via `cargo bench -p ironbus-storage`; not wired into per-PR CI. Measures the IO-light framing + CRC +
# buffer cost over the in-memory filesystem, NOT device-dependent fsync latency. The regression gate is
# #114.
[[bench]]
name = "wal_append"
harness = false

# Informational micro-bench for the consume read LOCATE (#537): full-scan-per-delivery (the
# pre-#483 behavior) vs the resident sparse-byte-index seek, over a single many-record segment.
# Run on demand (`cargo bench -p ironbus-storage`), not wired into per-PR CI; the full consume-vs-NATS
# leg is #554.
[[bench]]
name = "read_seek"
harness = false

# Informational micro-bench for the off-actor consume read plane's multi-consumer SCALING (#539):
# N concurrent consumers' aggregate sealed-prefix read throughput OFF-ACTOR (lock-free `ReadPlane`
# snapshot) vs THROUGH-ACTOR (a single `Mutex<Log>`, the serialized append actor). Off-actor scales
# with the consumer count; through-actor stays flat (the #491 ceiling). Run on demand
# (`cargo bench -p ironbus-storage`), not in per-PR CI; the full consumer-vs-NATS leg is #554.
[[bench]]
name = "consume_scaling"
harness = false

# Informational micro-bench for the ZERO-COPY consume delivery read primitive (#542, M1-I6): the
# MATERIALIZE+ENCODE delivery path (read_range -> OwnedRecords -> re-encode each into a wire-delivery
# body) vs the ZERO-COPY raw byte run (read_range_raw -> one Bytes slice, no decode, no re-encode, no
# payload copy), over the in-memory filesystem and swept across payload sizes. The zero-copy read is a
# large multiple faster (one alloc + zero per-record decode/encode); the gap is the consume throughput
# lever. Run on demand (`cargo bench -p ironbus-storage`), not in per-PR CI; the full consume-vs-NATS
# leg is #554.
[[bench]]
name = "zero_copy_delivery"
harness = false

# Informational micro-bench + PROOF for the cross-stream CommitCoordinator (#564, M2-I3): the batched
# durability barrier over a StreamSet. Counts the ACTUAL fdatasyncs a commit tick issues (via the
# counting FaultFs) for a FIXED total record rate spread across 1/4/16 streams, proving the fsync
# COUNT is O(dirtied-streams-per-tick) while the per-RECORD fsync cost stays O(1/batch) — group-commit
# generalized across streams. A second criterion-timed leg measures the coordinator's CPU overhead per
# tick over the in-memory fs (no device fsync). Run on demand (`cargo bench -p ironbus-storage`), not in
# per-PR CI; device-dependent fsync latency is the macro rig's job.
[[bench]]
name = "commit_coordinator"
harness = false

# Informational micro-bench + PROOF for PARTITIONS as the parallel-consume lever (#591, M2-I11): a
# stream split into P independent sub-logs lets P consumers drain P partitions in PARALLEL, where a
# single total-order log (P=1) admits one ordered reader. Spreads a FIXED total record rate across
# 1/2/4/8 partitions and times the aggregate parallel drain (P threads, each its own partition) over
# the in-memory fs — the aggregate time falls as P rises (per-partition order preserved, no
# cross-partition order). Run on demand (`cargo bench -p ironbus-storage`), not in per-PR CI; the full
# consume-vs-NATS leg is #554.
[[bench]]
name = "partition_parallel_consume"
harness = false
