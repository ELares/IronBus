[package]
name = "ironbus-core"
description = "Core types and IO-free logic for IronBus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
crc32c = "0.6"

[dev-dependencies]
criterion = "0.5"
proptest = "1"

[lints]
workspace = true

# Informational micro-benches for the IO-free hot-path codecs (#112). Run on demand via
# `cargo bench -p ironbus-core`; not wired into per-PR CI. The regression gate is #114.
[[bench]]
name = "codec"
harness = false

[[bench]]
name = "cursor"
harness = false
