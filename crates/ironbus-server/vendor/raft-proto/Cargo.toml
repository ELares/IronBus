# Vendored, build-script-free raft-proto 0.7.0 (the raft-rs codec crate).
#
# This is a drop-in replacement for the crates.io `raft-proto` 0.7.0, used via
# `[patch.crates-io]` in the workspace root so the upstream `raft` 0.7.0 crate links it
# instead of the original. The ONLY differences from upstream are: (1) NO `build.rs` and
# NO `protobuf-build` build-dependency -- the generated `eraftpb` codec is committed as
# source under `src/protos/eraftpb.rs` instead of being regenerated by `protoc` at build
# time; (2) `#![allow(...)]` blankets so the generated code stays `-D warnings`-clean.
# Public API (`eraftpb`, `confchange`, `confstate`, `prelude`, `util`) is unchanged.
#
# Deliberately NOT a workspace member and deliberately does NOT inherit the workspace
# `[lints]`: it is third-party generated code, kept self-contained with its own pins. The
# version is held at 0.7.0 to match the `raft` crate it patches.
[package]
name = "raft-proto"
version = "0.7.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
description = "Vendored, build-script-free raft-proto: pre-generated rust-protobuf eraftpb codec for raft-rs."
repository = "https://github.com/ELares/IronBus"
publish = false

[dependencies]
# The PURE-RUST protobuf 2 RUNTIME only (no codegen). `bytes` matches raft 0.7's
# protobuf-codec feature: the generated structs hold `bytes::Bytes` for `bytes` fields.
protobuf = { version = "=2.28.0", features = ["bytes"] }
bytes = { version = "1", default-features = false }

[features]
# Mirror upstream's feature names so `raft`'s `protobuf-codec = ["raft-proto/protobuf-codec"]`
# resolves. They are intentionally INERT here: there is no build script to switch on, the
# codec is already committed. `prost-codec` is accepted-but-unsupported (we ship the
# rust-protobuf codec only); selecting it changes nothing in this vendored crate.
default = ["protobuf-codec"]
protobuf-codec = []
prost-codec = []
