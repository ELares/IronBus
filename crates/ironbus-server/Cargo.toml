[package]
name = "ironbus-server"
description = "IronBus broker server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The DEFAULT shipped feature set carries ZERO opentelemetry dependencies: the `tracing` crate and
# the JSON log layer are always compiled, but OTLP span export is behind the non-default `otlp`
# feature below, so neither the default binary nor the `edge-min` build links opentelemetry (#99).
default = []
# OTLP span export (#99, #352): the feature-gated, non-default export seam. Compiling this in pulls
# the opentelemetry / opentelemetry-otlp / opentelemetry_sdk tree and wires the bounded-lossy-queue
# drain into the concrete OTLP-over-the-wire span exporter. Kept OFF by default and out of `edge-min`
# so the default/edge-min dependency graph is opentelemetry-free and the binary stays small. The
# optional deps below are pulled ONLY by this feature, so `cargo build` (default) links none of them.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tokio",
]
# The size-optimized edge build profile marker (#99, build-dist): a deliberately EMPTY feature that
# selects the leanest tracing surface. It MUST NOT enable `otlp`, so an `edge-min` build compiles the
# OTLP export out entirely and the binary shrinks measurably versus an `otlp` build. It is a marker
# feature (no extra deps); the compile-out is enforced by it never pulling `otlp`.
edge-min = []

[dependencies]
ironbus-core = { path = "../ironbus-core", version = "0.0.0" }
ironbus-proto = { path = "../ironbus-proto", version = "0.0.0" }
ironbus-storage = { path = "../ironbus-storage", version = "0.0.0" }

# Embedded metadata Raft group (V2-C1, #578). `raft` is tikv/raft-rs, the production TiKV
# Raft CORE (Apache-2.0): storage- and transport-agnostic, SYNCHRONOUS and caller-driven
# (`RawNode` + tick/step/ready/advance), with first-class joint-consensus membership and
# learners. It is wired ONLY here (ironbus-server), NEVER ironbus-core, so the IO-free /
# async-free core invariant is untouched; raft-rs pulls no async runtime (no tokio/mio/
# async-std/smol), so the `cargo tree -p ironbus-core` async-runtime guard stays green.
#
# Pinned `=0.7.0` (raft-rs is pre-1.0; a `=` pin + `--locked` localizes any churn behind the
# `cluster` module). `default-features = false` drops the `default-logger` (slog-term /
# slog-envlogger / slog-stdlog) and the failpoints surface; we keep ONLY `protobuf-codec`.
#
# THE CODEC IS VENDORED, NOT GENERATED. `protobuf-codec` makes `raft` use `raft-proto`'s
# rust-protobuf `eraftpb` types -- whose upstream `build.rs` would regenerate them via
# `protoc`/`prost-build` at build time. IronBus runs NO build-time codegen, so the workspace
# root redirects `raft-proto` to a vendored, build-script-free drop-in via `[patch.crates-io]`
# (the generated `eraftpb` committed as source under `vendor/raft-proto`). Net effect: the real
# raft-rs core is linked, but the build runs NO `protoc` and NO build script, and the only new
# protobuf dependency is the PURE-RUST `protobuf` 2 RUNTIME crate. The whole new tree (`raft`,
# the vendored `raft-proto`, `protobuf`, `slog`, `fxhash`, `getset`, `erased-serde`, `rand`/
# `getrandom`, ...) is permissive (Apache-2.0 / MIT, on the deny.toml allow-list) and carries
# NO `links` key and NO C-builder build-dep, so the C-FFI ban and the pure-Rust posture hold.
# MSRV: the whole tree builds on stable 1.78 with the committed lock (validated by the
# `msrv (1.78)` gate). For THIS issue the metadata group is a new, NOT-YET-WIRED module, so the
# default single-node binary's behavior and on-disk layout are byte-for-byte unchanged.
raft = { version = "=0.7.0", default-features = false, features = ["protobuf-codec"] }

# `raft-proto` is raft-rs's eraftpb / conf-change types crate. raft-rs takes (and does NOT
# re-export) the `ConfChangeI` trait from here — `RawNode::propose_conf_change` /
# `apply_conf_change` are `impl ConfChangeI` — so the C1-I4 (#584) membership apply path names
# it directly. It is the SAME crate already in the tree: the workspace root patches `raft-proto`
# to the build-script-free vendored drop-in (`[patch.crates-io]`), so this resolves to that exact
# `=0.7.0` vendored copy, adds NO new crate to the graph, and does not change `Cargo.lock`.
# Pure Rust (no `protoc`, no `links`, no C build script), permissive (Apache-2.0), MSRV below 1.78.
raft-proto = { version = "=0.7.0", default-features = false }

# raft-rs's `RawNode::new` takes a `&slog::Logger` and does not re-export `slog`, so it is a
# direct dependency here. We pass a `Discard` drain (default-logger is off), so no log output
# is produced; bridging raft-rs's slog to IronBus's `tracing` is deferred (C1-I3+). `slog` is
# already in the tree via `raft`, is pure Rust (no `links`, no C build script), and is
# permissive (its `MPL-2.0 OR MIT OR Apache-2.0` license resolves to the allowed MIT/Apache
# arm, so cargo-deny accepts it). No new crate enters the graph.
slog = { version = "2", default-features = false }

# Durable metadata Raft log codec (V2-C1, #580). The metadata `Storage` (C1-I2) persists each raft
# `Entry` / `HardState` / `ConfState` to the IronBus CRC-framed log as its `protobuf` wire bytes —
# the SAME encoding raft-rs uses internally via the vendored `eraftpb` types — so an entry round-trips
# byte-for-byte across a restart. `protobuf` is the PURE-RUST runtime crate (no `protoc`, no `links`,
# no C build script) ALREADY resolved in the lockfile (`=2.28.0`) by `raft`'s `protobuf-codec` feature
# and the vendored `raft-proto`, so making it a first-class dependency here adds NO new crate to the
# graph and does not change `Cargo.lock`. Permissive (MIT / Apache-2.0), on the deny.toml allow-list,
# MSRV well below the workspace 1.78 floor. `default-features = false` keeps the lean runtime surface.
protobuf = { version = "2", default-features = false }

# Refcounted byte buffer for the produce hot path (#474). `OwnedAppend` carries the publish payload
# (and key/headers/dedup ids) as `bytes::Bytes` so moving a produce across the append-actor channel is
# a refcount bump, not a per-publish `Vec` deep copy. `bytes` is pure Rust (no `links`, no C build
# script, no vendored crypto), MIT-licensed (already on the deny.toml allow-list via the otlp tree),
# with an MSRV well below the workspace 1.78 floor. It is already resolved in the lockfile (1.11.x) by
# the all-features otlp/tonic tree, so making it a first-class default dependency adds no new crate.
bytes = { version = "1", default-features = false }

# Structured tracing (#16, #99). `tracing` is the instrumentation facade; `tracing-subscriber` (the
# `fmt` + `json` features only, no `env-filter`/`ansi`, to keep the transitive surface minimal)
# provides the JSON log layer compiled in BY DEFAULT. Both, and their whole transitive tree
# (tracing-core/-attributes/-serde, serde/serde_json, sharded-slab, thread_local, once_cell, ...),
# are permissive (MIT or MIT OR Apache-2.0) and pure Rust, already covered by the deny.toml license
# allow-list; none is opentelemetry, so the default/edge-min graph stays OTLP-free. All have an MSRV
# at or below the workspace 1.78 floor.
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }

# OTLP span export (#99, #352), OPTIONAL and pulled ONLY by the non-default `otlp` feature above, so
# the DEFAULT and `edge-min` builds link ZERO opentelemetry crates (verify with
# `cargo tree --edges normal` having no opentelemetry; the SBOM-diff + C-FFI gates run on that
# default graph and are unchanged). TRANSPORT CHOICE (the #352 C-FFI-minimization decision): the
# gRPC/tonic exporter with NO TLS feature. OTLP to a co-located collector is plaintext
# `http://host:4317`, so no TLS stack is linked: this deliberately avoids `rustls` (which pulls the
# `ring`/`aws-lc-sys` vendored-C/asm crypto the deny.toml `[bans]` denylist forbids) and avoids
# `native-tls`/`openssl-sys` entirely. The whole pulled tree (tonic, prost, hyper, h2, tower, tokio,
# http, bytes, ...) is PURE RUST with no `links` key and no C-building build script, so even the
# `--features otlp` build carries no C-FFI; the only TLS-free transport keeps the otlp build clean,
# not just the default one. `default-features = false` drops opentelemetry-otlp's default
# `reqwest`/`http` surface; `grpc-tonic` selects the tonic transport; `trace` scopes the SDK to the
# span pipeline (no metrics/logs). MSRV: opentelemetry-otlp 0.27 declares MSRV 1.71.1, below the
# workspace 1.78 floor, and its transitive tree resolves at or under 1.78 (validated by the
# `msrv (1.78)` CI gate). The opentelemetry tree is Apache-2.0; its transitive licenses are added to
# the deny.toml allow-list (cargo-deny resolves all-features, so it sees this tree).
opentelemetry = { version = "0.27", optional = true, default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.27", optional = true, default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.27", optional = true, default-features = false, features = ["grpc-tonic", "trace"] }
# The OTLP gRPC exporter's batch span processor and the tonic channel need a Tokio runtime; the
# exporter spins a SMALL current-thread runtime on its own drain thread (NOT the broker's
# thread-per-core path), so the export IO never touches a core. Optional, `otlp`-only: the default
# build links no tokio. `rt` + `net` + `time` is the minimal surface (a current-thread runtime, the
# TCP socket, and the batch timer); no `rt-multi-thread`, no `macros`.
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "net", "time"] }

[dev-dependencies]
tempfile = "3"
# The semantics conformance vector suite (#35) is a checked-in JSON data file driven by a Rust
# harness test. `serde`/`serde_json` parse the vectors; they are DEV-ONLY (the JSON format crate is
# never linked into the shipped broker binary), matching the storage crate's loss-report fixtures.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
