[package]
name = "ironbus-cli"
description = "IronBus command-line interface: broker and diagnostics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ironbus"
path = "src/main.rs"

[features]
# The DEFAULT binary carries the `tracing` JSON log layer and ZERO opentelemetry: OTLP span export is
# behind `ironbus-server`'s non-default `otlp` feature, forwarded here so a maintainer can build the
# OTLP-export broker explicitly (#99).
default = []
# Forward OTLP span export: `cargo build -p ironbus-cli --features otlp` compiles the export seam in.
otlp = ["ironbus-server/otlp"]
# The size-optimized edge build: `cargo build -p ironbus-cli --features edge-min` forwards the
# server's `edge-min` marker, which MUST NOT enable `otlp`, so the binary links no opentelemetry and
# shrinks versus an `otlp` build (#99).
edge-min = ["ironbus-server/edge-min"]
# OPT-IN zstd codec + the trained-dictionary lifecycle (#357). NON-DEFAULT: compiling it in pulls
# the vendored-C `zstd` library (static-linked) and the BLAKE3 dict_id hash, and enables the
# `ironbus dict train`/`install`/`ls` subcommands. The DEFAULT binary, its SBOM, and the cffi-ban
# gate are UNCHANGED (zstd absent by default), per ADR-0003. Forwards the feature to storage (the
# sidecar IO) and through it to ironbus-core (the codec + training).
zstd = ["ironbus-storage/zstd", "ironbus-core/zstd"]
# TLS 1.3 transport (ADR-0004, #766). NON-DEFAULT: forwards ironbus-server's `tls` feature so
# `cargo build -p ironbus-cli --features tls` produces a broker that carries the rustls + aws-lc-rs
# stack, AND ironbus-client's `tls` feature (#957) so the CLIENT verbs (pub/sub/ack) can dial a
# TLS broker configured on the active context. The DEFAULT binary links no TLS code and no new C (the
# aws-lc-sys allowance is feature-scoped in deny.toml, and cffi-ban.sh proves the default ironbus-cli
# graph stays pure-Rust).
tls = ["ironbus-server/tls", "ironbus-client/tls"]

[dependencies]
ironbus-core = { path = "../ironbus-core", version = "0.0.0" }
ironbus-proto = { path = "../ironbus-proto", version = "0.0.0" }
ironbus-client = { path = "../ironbus-client", version = "0.0.0" }
ironbus-server = { path = "../ironbus-server", version = "0.0.0" }
ironbus-storage = { path = "../ironbus-storage", version = "0.0.0" }

# A content fingerprint for the upgrade rollback's known-bad guard (#348): the failed-start counter
# records the fingerprint of the binary that failed N starts, so a rollback re-entered after a power
# cut in the two-rename window can never PROMOTE the known-bad bytes. crc32c is already in the tree
# (ironbus-core's record/segment checksums) and on the deny.toml allow-list (MIT OR Apache-2.0); it
# is a non-cryptographic content identity (paired with the byte length), never a security boundary.
crc32c = "0.6"

# The TOML config-FILE parser (#85, #86, #382), the maintainer-approved pure-Rust dependency. It
# parses a `--config <path>` file into a typed `toml::Value` the resolver flattens, slotting the
# FILE layer between env and default (flag > env > FILE > default). `toml 0.5` is chosen for its
# MINIMAL dependency surface: its ONLY dependency is `serde` (already in the tree via
# tracing-subscriber's json feature), so it pulls NO new crates (no toml_edit / indexmap / hashbrown
# / winnow), which keeps the 1.78 MSRV gate green (indexmap 2.10+ needs edition2024) and the
# SBOM round-trip clean (no foldhash drift). It is PURE RUST with no `links` key or C build script,
# so the #102 C-FFI ban and the #139 pure-Rust DATA-path policy stay clean (config parsing is a CLI
# startup concern, off the record path). Its `Value`/`type_str` API and its line/column parse errors
# give a broken file the exact location. The IO-free `ironbus-core` never sees it (the pure
# grammar/validator is in `ironbus-core::config`; only the whole-read file IO lives here).
toml = "0.5"

# Signal handling for `serve` (#195, #380): a dedicated signal thread distinguishes the signals so
# SIGINT/SIGTERM perform the graceful stop (flush every committed cursor, exit 0) while SIGHUP
# performs a live config RE-READ (the runtime reload trigger #380 names), the conventional daemon
# split (nginx/sshd `kill -HUP` = reload). The previous `ctrlc` dependency could NOT tell the signals
# apart — its `termination` feature bound SIGHUP to the same stop path (the #195/#431 residual) — so
# it is replaced by `signal-hook`, which registers PER signal and delivers them to an ordinary thread
# via a self-pipe. That keeps the reload's file IO out of an async-signal handler AND avoids a
# hand-rolled `unsafe` sigaction (the maintainer's no-unsafe-signal stance, since Miri cannot exercise
# OS signal delivery). It is pure Rust and pulls only `signal-hook-registry` + `libc`, both permissive
# (MIT OR Apache-2.0) and on the deny.toml allow-list. We take ONLY the `iterator` feature (with
# default-features off): signal-hook gates an OPTIONAL `cc` build-dependency (a tiny C `siginfo` shim)
# behind its non-default `extended-siginfo-raw` feature, which we do NOT enable, so the shipped binary
# compiles ZERO C (the cc dep stays dormant in the lock). That keeps the #102/#139 pure-Rust ban
# clean; `signal-hook` is allowlisted in `deny.toml` and `scripts/ci/cffi-ban.sh` on exactly this
# basis (the optional, unenabled cc), NOT because it can never carry C. CLI-only and Unix-only, like
# `serve` itself (on-disk storage uses positioned IO the Windows path lacks), so the non-Unix build
# neither spawns the signal thread nor pulls the dependency.
[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
# The single-broker data-dir lock (#89) calls `flock(2)` directly for an exclusive advisory lock on
# the data dir's `LOCK` file, so a second `serve` on one data dir fails fast instead of corrupting
# the log with concurrent writers. `libc` is already in the tree (pulled by `signal-hook`) and on the
# `deny.toml` allow-list (MIT OR Apache-2.0); this makes it a direct, Unix-only dependency. It is
# the libc binding only (not vendored C), so the #139 pure-Rust DATA-path policy is unchanged: the
# lock is a CLI startup guard, off the record path.
libc = "0.2"

# TEST-ONLY (#480): a `#[cfg(test)]` redrive fixture seeds the DLQ with an `ironbus_storage`
# `OwnedRecord`, whose key/headers/payload are now `bytes::Bytes` (refcounted read-buffer slices).
# `bytes` is a DEV-dependency here, so it never enters the shipped CLI binary's dependency graph and
# leaves the supply-chain / C-FFI gates untouched; it is pure Rust and already in the workspace tree.
[dev-dependencies]
bytes = { version = "1", default-features = false }
# Temp dirs for the StrictModes secret-file-permission tests and the auth-config-table load tests
# (#629/#631/#635, V2-M7). DEV-ONLY (never linked into the shipped `ironbus` binary), permissive
# (MIT OR Apache-2.0), already in the workspace lock (the server/storage crates use it). The same
# pure-Rust crypto crates the auth path uses are dev-deps here so a test can MINT a known
# token-SHA-256 / Argon2id-PHC fixture; they are DEV-ONLY for the CLI (the runtime auth verification
# lives in `ironbus-server`, already a normal dependency).
tempfile = "3"
sha2 = { version = "0.10", default-features = false }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }

[lints]
workspace = true

# Debian package metadata for `cargo deb` (#104). cargo-deb is a BUILD-TIME tool, never a runtime or
# compile dependency of any shipped crate, so it adds nothing to the binary's dependency graph and
# leaves the cargo-deny supply-chain gate untouched. The package bundles the static binary, the
# systemd unit, and the default config; `.rpm` is deferred behind the same spec until a dnf fleet
# exists (the same `assets` map drives an nfpm config when that lands). See docs/DISTRIBUTION.md.
#
# The CI/release path builds the verified static musl binary FIRST, then packages it with
# `cargo deb --no-build --no-strip` so the .deb ships the exact reproducible release bytes (not a
# fresh glibc rebuild). `maintainer-scripts` adds the ironbus system user on install.
[package.metadata.deb]
name = "ironbus"
maintainer = "The IronBus Authors <noreply@github.com>"
copyright = "The IronBus Authors"
license-file = ["../../LICENSE-APACHE", "0"]
extended-description = """\
IronBus is a durable, single-binary edge message queue: a produce/consume broker with an on-disk \
write-ahead log, at-least-once delivery, and a fail-closed installer. This package installs the \
broker binary, a systemd unit running it as the unprivileged `ironbus` user, and a default \
configuration."""
section = "net"
priority = "optional"
# Depend only on systemd (for the unit); the binary itself is static musl, so it has no library deps.
depends = "systemd"
assets = [
    ["target/release/ironbus", "usr/bin/", "755"],
    ["../../packaging/ironbus.env", "etc/ironbus/ironbus.env", "644"],
    ["../../README.md", "usr/share/doc/ironbus/README.md", "644"],
    ["../../docs/DISTRIBUTION.md", "usr/share/doc/ironbus/DISTRIBUTION.md", "644"],
]
# The default config is a conffile: an operator's local edits survive a package upgrade.
conf-files = ["/etc/ironbus/ironbus.env"]
maintainer-scripts = "../../packaging/debian/"
# The systemd unit is installed and registered (daemon-reload) by the cargo-deb systemd integration,
# which reads it from `unit-scripts`. It is installed but NOT enabled or started automatically, so an
# operator enables it deliberately (`systemctl enable --now ironbus`); the postinst still creates the
# `ironbus` system user and the data dir first.
systemd-units = { unit-scripts = "../../packaging/systemd", unit-name = "ironbus", enable = false, start = false }
