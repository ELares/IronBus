[package]
name = "ironbus-bench"
description = "Open-loop macro-bench harness for IronBus: the honest, coordinated-omission-free SLO instrument."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Off the default `cargo publish` path: this is an internal measurement tool, not a shipped crate.
publish = false

[[bin]]
name = "ironbus-bench"
path = "src/main.rs"

# The CI regression gate (#114): reads the per-device run history + the last-released-tag baseline
# from JSON and exits non-zero only on an un-ratified rolling-median regression. It GRACEFULLY NO-OPS
# (exit 0, logged "no baseline history yet") when no baseline exists, which is the state today (no
# released tag until v0.1.0). Off the shipped binary graph, like the rest of this crate.
[[bin]]
name = "ironbus-regression-gate"
path = "src/bin/regression_gate.rs"

# Assembles the competitor benchmark corpus (#19/#114): ingests the corpus_bench.py
# rows and builds a durability-lint-validated ComparisonReport + markdown. On demand.
[[bin]]
name = "assemble-corpus"
path = "src/bin/assemble_corpus.rs"

# Single-consumer streaming-consume throughput: the batched + read-ahead DEFAULT vs the
# per-message-fetch + per-message-commit path (#550, M1-I10). The consume-side proof that sets up the
# #554 NATS comparison; off the per-PR CI path, run on demand. Unix-only (uses the in-process broker).
[[bin]]
name = "stream-consume-bench"
path = "src/bin/stream_consume_bench.rs"

# Assembles the SINGLE-CONSUMER CONSUME corpus (#554, V2-M1): ingests the consume_bench.py rows and
# builds a durability-lint-validated ComparisonReport pairing IronBus Tier-S streaming consume against
# a NATS JetStream durable pull consumer at the matched `durable-consume` label (the headline V2-M1
# consume proof), with the Tier-W work-queue + NATS core sub as appendix context. The consume-side
# twin of `assemble-corpus`; its unit tests are the CI-checkable fairness gate. On demand.
[[bin]]
name = "consume-corpus"
path = "src/bin/consume_corpus.rs"

# Clustered-consume APPORTIONED-READ throughput vs replica count (#634, V2-C8-I5): builds a real
# on-disk leader log + a live `DataPlaneRuntime` cluster (R in {1,3,5}) over loopback, waits for the
# followers to replicate the committed prefix, then drains it from a consumer fleet apportioned across
# the replicas via the #723 follower-read serve path. Emits per-run JSONL rows. Unix-only (the broker
# is Unix-only). On demand; off the per-PR CI path.
[[bin]]
name = "cluster-consume-bench"
path = "src/bin/cluster_consume_bench.rs"

# C8 DURABILITY / CORRECTNESS fault-injection harness (#627, #628, #630): builds a REAL local IronBus
# cluster (real on-disk leader + replica logs, real CRC-revalidated replication, the real quorum-fsync
# ISR gate + quarantine-never-delete divergence + epoch-fenced promotion — the SAME `DataPlaneRuntime`/
# `DataPlaneController` machinery as the throughput legs) and injects a REAL fault — a node-death
# power-cut (#627), an on-disk replica-segment byte corruption (#628), or a minority isolation +
# fenced promotion (#630) — then re-opens the survivors' on-disk logs to MEASURE what survived /
# re-converged / diverged. Emits one JSONL row per scenario. Unix-only (the broker is Unix-only). On
# demand; off the per-PR CI path. See docs/benchmarks/cluster_durability_bench.py for the NATS leg.
[[bin]]
name = "cluster-durability-bench"
path = "src/bin/cluster_durability_bench.rs"

[dependencies]
# The harness drives the broker through the REAL #11 client over a real socket, never a privileged
# test path; it launches the shipping `ironbus` binary built by `ironbus-cli`.
ironbus-client = { path = "../ironbus-client", version = "0.1.0" }
ironbus-proto = { path = "../ironbus-proto", version = "0.1.0" }
# HdrHistogram for the latency tail (1 us to 60 s, 3 significant figures). The `serialization`
# feature gives the standard V2+DEFLATE encoder so a run's RAW histogram is archived base64 and is
# recomputable/mergeable across windows. MIT OR Apache-2.0.
hdrhistogram = { version = "7.5", features = ["serialization"] }
# Poisson-distributed (exponential) inter-arrival jitter for the open-loop arrival schedule.
# MIT OR Apache-2.0; `rand` is already in the workspace lock (a dev-dep of proptest).
rand = "0.9"
rand_distr = "0.5"
# Versioned provenance JSON (git SHA, build flags, host, config, raw histogram, reproduce command).
# Already in the workspace lock. MIT OR Apache-2.0.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SIGSTOP/SIGCONT for the (now `--ignored`-only) live OS-freeze path, and the macOS monotonic-raw
# clock. Unix only, `cfg`-gated. A foreign call, not `unsafe`-free; the few `libc` calls are isolated
# and documented. The in-process broker for the DETERMINISTIC injected-stall self-test (#284) is also
# Unix-only (the shipped broker is Unix-only), so the server/storage/core deps are cfg(unix) too: they
# run the SAME `ironbus-server` engine + append actor + `serve` the binary ships, over a
# `FaultFs<InMemoryFs>` whose sync gate (#177) freezes the broker's group-commit fsync deterministically
# (a condvar gate, no OS scheduling), so the freeze ALWAYS lands in the recorded tail.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
ironbus-server = { path = "../ironbus-server", version = "0.1.0" }
ironbus-storage = { path = "../ironbus-storage", version = "0.1.0" }
ironbus-core = { path = "../ironbus-core", version = "0.1.0" }

[lints]
workspace = true
